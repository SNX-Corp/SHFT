<?xml version="1.0" encoding="UTF-8"?>
<!--
  SHFT ROBOTICS  |  STICKER: bolt-diecut
  Kiss-cut bolt sticker on transparent, with a white keyline halo around the bolt silhouette.
  Colors: WHITE #FFFFFF (halo backing), LIME #A6FF00 (bolt, spot Pantone 802 C / 809 C).
  CUT CONTOUR: the magenta (#FF00FF) 1pt path id="CutContour" follows the bolt-with-halo silhouette.
  This is a KISS-CUT: the vinyl face is cut to the contour, the backing liner is left whole.
  Canvas 600 x 600 user units; finished bolt height ~70 mm. Halo = white stroke offset outside the bolt.
  NOTE: the white halo here is rendered by a thick white stroke on a copy of the bolt path (round joins),
  which gives the classic die-cut sticker border. The magenta CutContour traces the outer edge of that halo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- transparent background: no fill rect on purpose -->

  <!-- bolt placed centered: source viewBox 938.86 126.55 488.92 826.0; scale 0.5404, centered -->
  <g transform="translate(300 300) scale(0.5404) translate(-1183.320 -539.550)">

    <!-- CUT CONTOUR (outermost): magenta 1pt die line, traces the halo edge. Does not print. -->
    <path id="CutContour" d="M1045.92,580.82L1134.07,581.32L938.86,952.55L1320.72,498.28L1232.57,497.77L1427.78,126.55Z"
      fill="none" stroke="#FF00FF" stroke-width="69" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- WHITE HALO: thick white stroke + fill creates the keyline border -->
    <path d="M1045.92,580.82L1134.07,581.32L938.86,952.55L1320.72,498.28L1232.57,497.77L1427.78,126.55Z"
      fill="#FFFFFF" stroke="#FFFFFF" stroke-width="64" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- BOLT: lime artwork on top of the white halo -->
    <path d="M1045.92,580.82L1134.07,581.32L938.86,952.55L1320.72,498.28L1232.57,497.77L1427.78,126.55Z" fill="#A6FF00"/>
  </g>
</svg>
