<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHFT ROBOTICS // OFFICIAL KIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --ink-2:#141414;
    --ink-3:#1A1A1A;
    --green:#A6FF00;
    --green-dim:#7ec000;
    --white:#FFFFFF;
    --grey:#A3A3A3;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Raleway',sans-serif;
  }

  /* ---------- STAGE ---------- */
  .stage{
    position:relative;
    width:1600px;
    height:1800px;
    overflow:hidden;
    background:
      radial-gradient(1200px 900px at 30% 18%, #232323 0%, #141414 38%, #0A0A0A 70%, #060606 100%);
    isolation:isolate;
  }

  /* spotlight from upper-left */
  .spot{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(900px 760px at 24% 12%, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 30%, transparent 60%),
      radial-gradient(1400px 1200px at 86% 96%, rgba(166,255,0,.10) 0%, transparent 55%);
  }
  /* vignette */
  .vignette{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(1300px 1300px at 50% 44%, transparent 52%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.85) 100%);
  }

  /* dot grid texture */
  .grid{
    position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(166,255,0,.10) 1.3px, transparent 1.4px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(1100px 900px at 50% 40%, #000 0%, transparent 78%);
            mask-image:radial-gradient(1100px 900px at 50% 40%, #000 0%, transparent 78%);
  }
  /* diagonal speed slashes */
  .slashes{
    position:absolute; inset:-10%; z-index:1; pointer-events:none; opacity:.07;
    background:repeating-linear-gradient(118deg, transparent 0 46px, var(--green) 46px 49px, transparent 49px 96px);
    -webkit-mask-image:linear-gradient(118deg, transparent 0%, #000 30%, transparent 70%);
            mask-image:linear-gradient(118deg, transparent 0%, #000 30%, transparent 70%);
    mix-blend-mode:screen;
  }
  /* grain */
  .grain{
    position:absolute; inset:0; z-index:9; pointer-events:none;
    opacity:.10; mix-blend-mode:overlay;
  }
  .grain svg{ width:100%; height:100%; }

  /* ---------- BACKDROP TYPE ---------- */
  .ghost-word{
    position:absolute; z-index:1; pointer-events:none;
    left:50%; top:14%; transform:translateX(-50%);
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:300px; letter-spacing:.02em;
    color:transparent;
    -webkit-text-stroke:2px rgba(166,255,0,.07);
    white-space:nowrap; line-height:.8;
  }

  /* ---------- TOP CHROME ---------- */
  .topbar{
    position:absolute; z-index:7; top:64px; left:80px; right:80px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .wordmark{ height:60px; width:auto; max-width:560px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(166,255,0,.30)); }
  .kit-tag{
    display:flex; align-items:center; gap:14px;
    font-family:'Exo 2',sans-serif; font-weight:800;
    font-size:18px; letter-spacing:.32em; color:var(--grey);
    text-transform:uppercase;
  }
  .kit-tag .dot{ width:10px; height:10px; background:var(--green); box-shadow:0 0 14px var(--green); }
  .kit-tag b{ color:var(--white); font-weight:800; }

  /* ---------- STAGE GLOW PLATE behind hoodie ---------- */
  .halo{
    position:absolute; z-index:2; left:50%; top:760px; transform:translate(-50%,-50%);
    width:1080px; height:1080px;
    background:radial-gradient(circle at 42% 38%, rgba(166,255,0,.20) 0%, rgba(166,255,0,.05) 34%, transparent 60%);
    filter:blur(8px);
    pointer-events:none;
  }

  /* ====================================================
     HOODIE  (pure CSS shapes)
     wrapper holds the garment + its reflection.
     The garment is drawn inside a 900 x 1000 canvas.
  ==================================================== */
  .hoodie-wrap{
    position:absolute; z-index:4; left:50%; top:300px;
    transform:translateX(-50%);
    width:900px; height:1000px;
  }

  /* the reflection clone */
  .reflection{
    position:absolute; left:0; top:1006px;
    width:900px; height:1000px;
    transform:scaleY(-1);
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.40) 0%, transparent 40%);
            mask-image:linear-gradient(to bottom, rgba(0,0,0,.40) 0%, transparent 40%);
    opacity:.5; pointer-events:none; filter:blur(.5px);
  }

  .hoodie{
    position:absolute; inset:0;
    transform:perspective(2800px) rotateX(2deg);
    transform-style:preserve-3d;
    filter:drop-shadow(0 50px 60px rgba(0,0,0,.6));
  }

  /* ---- SLEEVES (raglan, drawn first so they sit behind) ---- */
  .sleeve{
    position:absolute; top:150px; width:300px; height:660px; z-index:2;
    background:
      linear-gradient(125deg,#242424 0%,#181818 46%,#0c0c0c 100%);
  }
  .sleeve.l{
    left:30px; transform:rotate(7deg);
    clip-path:polygon(58% 0, 100% 4%, 84% 100%, 18% 100%, 0 26%);
    box-shadow:inset 60px 0 90px -50px rgba(255,255,255,.14), inset -60px -30px 100px -50px rgba(0,0,0,.85);
    border-radius:130px 80px 30px 70px;
  }
  .sleeve.r{
    right:30px; transform:rotate(-7deg);
    clip-path:polygon(0 4%, 42% 0, 100% 26%, 82% 100%, 16% 100%);
    box-shadow:inset -50px 0 90px -50px rgba(0,0,0,.7), inset 40px -30px 100px -50px rgba(0,0,0,.6);
    border-radius:80px 130px 70px 30px;
  }
  /* ribbed cuffs */
  .cuff{
    position:absolute; bottom:6px; width:200px; height:70px;
    background:repeating-linear-gradient(90deg,#242424 0 8px,#0e0e0e 8px 16px);
    border-radius:10px;
    box-shadow:inset 0 16px 26px -16px rgba(255,255,255,.12), inset 0 -12px 20px -10px rgba(0,0,0,.85);
    z-index:3;
  }
  .sleeve.l .cuff{ left:14px; transform:skewX(-7deg) rotate(2deg); }
  .sleeve.r .cuff{ right:14px; transform:skewX(7deg) rotate(-2deg); }

  /* small green bolt patch on right sleeve */
  .sleeve-bolt{
    position:absolute; top:250px; right:96px; z-index:4;
    width:54px; height:auto; transform:rotate(-7deg);
    filter:drop-shadow(0 0 12px rgba(166,255,0,.8));
  }

  /* ---- HOOD (sits behind the body, framing the collar) ---- */
  .hood{
    position:absolute; left:50%; top:70px; transform:translateX(-50%);
    width:560px; height:300px; z-index:3;
    background:
      radial-gradient(100% 80% at 32% 6%, rgba(255,255,255,.12), transparent 46%),
      linear-gradient(122deg,#262626 0%,#181818 52%,#0b0b0b 100%);
    border-radius:230px 230px 70px 70px / 200px 200px 60px 60px;
    box-shadow:
      inset 60px 26px 90px -50px rgba(255,255,255,.14),
      inset -80px 0 120px -50px rgba(0,0,0,.85),
      0 14px 36px -10px rgba(0,0,0,.6);
  }
  /* the hood's rolled front edge (lighter lip) */
  .hood::after{
    content:""; position:absolute; left:8%; right:8%; top:54%; bottom:-2%;
    border-radius:0 0 180px 180px / 0 0 110px 110px;
    box-shadow:inset 0 -10px 22px -8px rgba(255,255,255,.10), inset 0 22px 40px -16px rgba(0,0,0,.7);
    background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,.35) 100%);
  }
  /* inner hood shadow (soft, not a black hole) */
  .hood-mouth{
    position:absolute; left:50%; top:158px; transform:translateX(-50%);
    width:320px; height:190px; z-index:4;
    background:radial-gradient(70% 90% at 50% 8%, #050505 0%, #0c0c0c 50%, #1a1a1a 100%);
    border-radius:160px 160px 130px 130px / 110px 110px 140px 140px;
    box-shadow:inset 0 26px 50px rgba(0,0,0,.85), inset 0 -14px 30px rgba(255,255,255,.05);
  }

  /* ---- BODY of the hoodie (the torso) ---- */
  .body{
    position:absolute; left:50%; top:250px; transform:translateX(-50%);
    width:560px; height:660px; z-index:5;
    background:
      radial-gradient(130% 80% at 30% 6%, rgba(255,255,255,.12) 0%, transparent 38%),
      linear-gradient(118deg,#2a2a2a 0%,#1d1d1d 32%,#161616 62%,#0c0c0c 100%);
    box-shadow:
      inset 70px 0 110px -50px rgba(255,255,255,.12),
      inset -100px 0 140px -60px rgba(0,0,0,.85),
      inset 0 -50px 90px -40px rgba(0,0,0,.8);
    /* tapered torso: wider at chest, narrows to waist, slight flare at hem */
    clip-path:polygon(
      14% 0%, 86% 0%,
      100% 10%, 96% 64%,
      99% 100%, 1% 100%,
      4% 64%, 0% 10%);
    border-radius:30px 30px 14px 14px;
  }
  /* soft diagonal studio sheen across the chest */
  .sheen{
    position:absolute; left:50%; top:250px; transform:translateX(-50%);
    width:560px; height:520px; z-index:6; pointer-events:none;
    background:linear-gradient(122deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.02) 22%, transparent 46%);
    clip-path:polygon(14% 0%, 86% 0%, 100% 10%, 96% 100%, 4% 100%, 0% 10%);
    mix-blend-mode:screen;
  }
  /* center seam / zip line */
  .seam{
    position:absolute; left:50%; top:300px; transform:translateX(-50%);
    width:2px; height:560px; z-index:6;
    background:linear-gradient(to bottom, rgba(255,255,255,.14) 0%, rgba(255,255,255,.05) 30%, rgba(0,0,0,.6) 100%);
  }

  /* ---- COLLAR / NECK ribbing in front of body ---- */
  .collar{
    position:absolute; left:50%; top:286px; transform:translateX(-50%);
    width:300px; height:96px; z-index:7;
    background:linear-gradient(110deg,#262626,#121212);
    box-shadow:inset 0 16px 24px -14px rgba(255,255,255,.12), inset 0 -16px 26px -10px rgba(0,0,0,.85);
    clip-path:polygon(10% 0, 90% 0, 100% 50%, 50% 100%, 0 50%);
    border-radius:50px 50px 20px 20px;
  }

  /* ---- DRAWSTRINGS ---- */
  .string{
    position:absolute; top:360px; width:9px; z-index:9;
    background:linear-gradient(to bottom,#3c3c3c,#181818);
    border-radius:6px;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), inset 1px 0 0 rgba(255,255,255,.14);
  }
  .string.l{ left:418px; height:236px; transform:rotate(2.5deg); }
  .string.r{ left:478px; height:262px; transform:rotate(-2deg); }
  .aglet{
    position:absolute; bottom:-32px; left:50%; transform:translateX(-50%);
    width:15px; height:40px; border-radius:4px;
    background:linear-gradient(to bottom,#0c0c0c,#000);
    box-shadow:inset 0 0 0 1px rgba(166,255,0,.55), 0 0 12px rgba(166,255,0,.3);
  }

  /* ---- KANGAROO POCKET ---- */
  .pocket{
    position:absolute; left:50%; top:660px; transform:translateX(-50%);
    width:400px; height:210px; z-index:7;
    background:linear-gradient(160deg,#242424 0%,#171717 50%,#0c0c0c 100%);
    border-radius:16px 16px 20px 20px;
    box-shadow:
      inset 60px 0 80px -55px rgba(255,255,255,.12),
      inset -70px 0 90px -50px rgba(0,0,0,.8),
      0 -2px 0 rgba(255,255,255,.07),
      0 12px 34px -10px rgba(0,0,0,.7);
    clip-path:polygon(2% 0, 98% 0, 90% 100%, 10% 100%);
  }
  /* pocket hand openings */
  .pocket::before,.pocket::after{
    content:""; position:absolute; top:22px; width:30px; height:150px;
    background:linear-gradient(120deg,#000,#0b0b0b);
    box-shadow:inset 0 0 14px rgba(0,0,0,.9);
  }
  .pocket::before{ left:30px; transform:skewX(9deg); border-radius:0 0 0 16px; }
  .pocket::after{ right:30px; transform:skewX(-9deg); border-radius:0 0 16px 0; }

  /* ---- BOTTOM RIBBED HEM ---- */
  .hem{
    position:absolute; left:50%; top:892px; transform:translateX(-50%);
    width:556px; height:58px; z-index:7;
    background:repeating-linear-gradient(90deg,#242424 0 9px,#0e0e0e 9px 18px);
    border-radius:0 0 14px 14px;
    box-shadow:inset 0 16px 24px -14px rgba(255,255,255,.12), inset 0 -10px 20px -8px rgba(0,0,0,.85);
    clip-path:polygon(1% 0, 99% 0, 96% 100%, 4% 100%);
  }

  /* ---- GREEN RIM LIGHT (right + bottom edge of torso) ---- */
  .rim{
    position:absolute; z-index:8; pointer-events:none;
    left:50%; top:250px; transform:translateX(-50%);
    width:560px; height:660px;
    box-shadow:
      18px 22px 60px -12px rgba(166,255,0,.30),
      inset -12px -14px 50px -22px rgba(166,255,0,.32);
    clip-path:polygon(14% 0%, 86% 0%, 100% 10%, 96% 64%, 99% 100%, 1% 100%, 4% 64%, 0% 10%);
    border-radius:30px 30px 14px 14px;
    mix-blend-mode:screen;
  }

  /* ---- CHEST EMBLEM (viewer's left chest) ---- */
  .chest{
    position:absolute; left:282px; top:336px; z-index:9;
    text-align:left;
  }
  .chest .emblem{
    width:104px; height:104px; display:block;
    filter:drop-shadow(0 0 16px rgba(166,255,0,.55)) drop-shadow(0 6px 10px rgba(0,0,0,.6));
  }
  .chest .chest-word{
    margin-top:12px;
    font-family:'Orbitron',sans-serif; font-weight:800;
    font-size:15px; letter-spacing:.16em; color:var(--white);
    text-shadow:0 0 12px rgba(166,255,0,.35);
    white-space:nowrap;
  }
  .chest .chest-word .g{ color:var(--green); }

  /* ====================================================
     FOOTER CAPTION + tagline
  ==================================================== */
  .tagline{
    position:absolute; z-index:7; left:50%; top:1452px; transform:translateX(-50%);
    display:flex; align-items:center; gap:26px;
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:48px; letter-spacing:.14em; color:var(--white);
    text-shadow:0 0 26px rgba(166,255,0,.20);
    white-space:nowrap;
  }
  .tagline .sep{
    display:inline-block; width:14px; height:14px; transform:rotate(45deg);
    background:var(--green); box-shadow:0 0 18px var(--green);
  }
  .tagline .lit{ color:var(--green); text-shadow:0 0 30px var(--green),0 0 60px rgba(166,255,0,.5); }

  .slogan{
    position:absolute; z-index:7; left:50%; top:1542px; transform:translateX(-50%);
    font-family:'Exo 2',sans-serif; font-weight:700;
    font-size:23px; letter-spacing:.42em; color:var(--grey);
    text-transform:uppercase; white-space:nowrap;
  }
  .slogan b{ color:var(--white); }

  /* foil bar */
  .foilbar{
    position:absolute; z-index:7; left:50%; top:1604px; transform:translateX(-50%);
    width:1180px; height:2px;
    background:conic-gradient(from 0deg, #A6FF00, #fff, #7ec000, #A6FF00, #4d7400, #A6FF00);
    opacity:.65;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
  }

  /* bottom caption bar (square UI chrome) */
  .caption{
    position:absolute; z-index:7; left:50%; bottom:70px; transform:translateX(-50%);
    display:flex; align-items:center; gap:0;
    border:1px solid rgba(166,255,0,.35);
    background:linear-gradient(180deg, rgba(20,20,20,.85), rgba(10,10,10,.92));
    box-shadow:0 0 40px rgba(166,255,0,.10), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .caption .seg{
    padding:18px 34px;
    font-family:'Exo 2',sans-serif; font-weight:800;
    font-size:22px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--white);
  }
  .caption .seg.alt{ color:var(--green); border-left:1px solid rgba(166,255,0,.30); border-right:1px solid rgba(166,255,0,.30); }
  .caption .seg.mut{ color:var(--grey); font-weight:700; }
  .caption .seg.chip{ background:var(--green); color:#0A0A0A; }

  /* partners */
  .partners{
    position:absolute; z-index:7; top:1684px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:28px;
    font-family:'Exo 2',sans-serif; font-weight:700;
    font-size:16px; letter-spacing:.28em; color:var(--grey);
    text-transform:uppercase;
  }
  .partners .lbl{ color:#6b6b6b; font-weight:600; letter-spacing:.34em; }
  .partners .p{ color:#c8c8c8; }
  .partners .pipe{ color:rgba(166,255,0,.5); }

  /* corner ticks */
  .tick{ position:absolute; z-index:7; width:46px; height:46px; pointer-events:none; }
  .tick.tl{ left:40px; top:40px; border-left:2px solid rgba(166,255,0,.6); border-top:2px solid rgba(166,255,0,.6); }
  .tick.tr{ right:40px; top:40px; border-right:2px solid rgba(166,255,0,.6); border-top:2px solid rgba(166,255,0,.6); }
  .tick.bl{ left:40px; bottom:40px; border-left:2px solid rgba(166,255,0,.6); border-bottom:2px solid rgba(166,255,0,.6); }
  .tick.br{ right:40px; bottom:40px; border-right:2px solid rgba(166,255,0,.6); border-bottom:2px solid rgba(166,255,0,.6); }
</style>
</head>
<body>
  <div class="stage">

    <!-- light + texture layers -->
    <div class="spot"></div>
    <div class="grid"></div>
    <div class="slashes"></div>
    <div class="ghost-word">SHFT</div>
    <div class="halo"></div>

    <!-- top chrome -->
    <div class="topbar">
      <img class="wordmark" src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS">
      <div class="kit-tag"><span class="dot"></span>OFFICIAL&nbsp;<b>KIT</b>&nbsp;/&nbsp;DROP&nbsp;01</div>
    </div>

    <!-- ========== HOODIE + REFLECTION ========== -->
    <div class="hoodie-wrap">

      <!-- main garment -->
      <div class="hoodie" id="garment">
        <!-- sleeves sit furthest back -->
        <div class="sleeve l"><div class="cuff"></div></div>
        <div class="sleeve r">
          <img class="sleeve-bolt" src="../brand-assets/bolt.svg" alt="">
          <div class="cuff"></div>
        </div>

        <!-- hood frames the collar -->
        <div class="hood"></div>
        <div class="hood-mouth"></div>

        <!-- torso -->
        <div class="body"></div>
        <div class="sheen"></div>
        <div class="collar"></div>
        <div class="seam"></div>

        <div class="string l"><div class="aglet"></div></div>
        <div class="string r"><div class="aglet"></div></div>

        <div class="pocket"></div>
        <div class="hem"></div>
        <div class="rim"></div>

        <div class="chest">
          <img class="emblem" src="../brand-assets/icon-transparent.png" alt="SHFT emblem">
          <div class="chest-word">SHFT <span class="g">ROBOTICS</span></div>
        </div>
      </div>

      <!-- reflection clone (built from same markup, simplified) -->
      <div class="reflection" aria-hidden="true">
        <div class="hoodie">
          <div class="sleeve l"><div class="cuff"></div></div>
          <div class="sleeve r"><div class="cuff"></div></div>
          <div class="hood"></div>
          <div class="hood-mouth"></div>
          <div class="body"></div>
          <div class="collar"></div>
          <div class="seam"></div>
          <div class="pocket"></div>
          <div class="hem"></div>
          <div class="chest">
            <img class="emblem" src="../brand-assets/icon-transparent.png" alt="">
          </div>
        </div>
      </div>

    </div>

    <!-- tagline -->
    <div class="tagline">
      <span>INNOVATE.</span><span class="sep"></span>
      <span>ADAPT.</span><span class="sep"></span>
      <span class="lit">SHFT.</span>
    </div>
    <div class="slogan">WE DON'T FOLLOW. <b>WE SHFT.</b></div>
    <div class="foilbar"></div>

    <!-- partners -->
    <div class="partners">
      <span class="lbl">POWERED WITH</span>
      <span class="p">ALT-F4</span><span class="pipe">/</span><span class="p">WCP</span>
    </div>

    <!-- bottom caption -->
    <div class="caption">
      <div class="seg">SHFT ROBOTICS</div>
      <div class="seg alt">//</div>
      <div class="seg chip">OFFICIAL KIT</div>
      <div class="seg mut">BUILDING THE FUTURE ONE SHIFT AT A TIME</div>
    </div>

    <!-- corner ticks -->
    <div class="tick tl"></div>
    <div class="tick tr"></div>
    <div class="tick bl"></div>
    <div class="tick br"></div>

    <!-- overlays on top -->
    <div class="vignette"></div>
    <div class="grain">
      <svg xmlns="http://www.w3.org/2000/svg">
        <filter id="grainf">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#grainf)"/>
      </svg>
    </div>

  </div>
</body>
</html>
