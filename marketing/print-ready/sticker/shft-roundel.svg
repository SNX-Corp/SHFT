<!--
  SHFT ROBOTICS  |  STICKER: shft-roundel
  75 mm circular die-cut roundel. Compact SHFT mark centered in a black disc with a white keyline.
  Colors: BLACK #1A1A1A (disc), WHITE #FFFFFF (keyline + SHFT letters), LIME #A6FF00 (accent stroke, spot Pantone 802 C / 809 C).
  CUT CONTOUR: the magenta (#FF00FF) 1pt path id="CutContour" is the die line. Do not print. Spot name "CutContour".
  Canvas 600 x 600 user units = 75 mm finished (8 unit/mm). Bleed disc extends past the die line.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <clipPath id="discClip">
      <circle cx="300" cy="300" r="278"/>
    </clipPath>
  </defs>

  <!-- bleed: black disc printed slightly larger than the cut line -->
  <circle cx="300" cy="300" r="292" fill="#1A1A1A"/>

