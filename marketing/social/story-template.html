<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Story Template (1080x1920)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
    SHFT STORY TEMPLATE  ·  1080 x 1920  (9:16)
    --------------------------------------------------------------
    HOW TO USE
    1. Open this file in Chrome.
    2. Edit the three swappable lines below in the HTML:
         - .headline   (Orbitron, big)
         - .subline    (the supporting line)
         - .cta        (the square button text)
    3. Screenshot the .frame at full size.
       Tip: zoom the browser to fit, then crop to the frame edges.
       Or use a 1080x1920 device emulation for a pixel-perfect grab.
    --------------------------------------------------------------
    REAL BRAND: dark #1A1A1A ground, white Orbitron headline, one lime
    emphasis word, lime accents, light wordmark.
    Sharp square edges. Lime is the one accent. No em dashes anywhere in copy.
  */
  :root {
    --ink:#1A1A1A; --panel:#202020; --line:#333333;
    --white:#FFFFFF; --muted:#A3A3A3;
    --lime:#A6FF00; --lime-hover:#8FE000; --lime-text:#1A1A1A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Raleway', sans-serif;
  }

  /* The capture frame. Screenshot exactly this. Dark #1A1A1A ground. */
  .frame {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: #1A1A1A;
    overflow: hidden;
    color: var(--white);
    display: flex;
    flex-direction: column;
  }

  /* Three diagonal lime slashes, top-right corner, low opacity */
  .slashes {
    position: absolute;
    top: -60px;
    right: -40px;
    width: 360px;
    height: 360px;
    z-index: 1;
    opacity: 0.12;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--lime) 0px,
      var(--lime) 14px,
      transparent 14px,
      transparent 52px
    );
  }
  /* Emblem watermark, low opacity, lower-left corner accent */
  .emblem {
    position: absolute;
    left: 80px;
    bottom: 360px;
    width: 110px;
    height: auto;
    opacity: 0.14;
    z-index: 1;
    pointer-events: none;
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 150px 96px 130px;
  }

  /* Top: section label, lime rule then Exo 2 label */
  .label {
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }
  .label .rule {
    display: inline-block;
    width: 48px; height: 4px;
    background: var(--lime);
  }
  .label .txt {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--white);
  }

  /* Middle: the headline block, pushed toward upper-middle */
  .main {
    margin-top: auto;
    margin-bottom: auto;
  }
  /* Short lime rule above the headline */
  .accent-rule {
    width: 120px; height: 8px;
    background: var(--lime);
    margin-bottom: 48px;
  }
  .headline {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 136px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--white);
  }
  /* On the dark ground, lime text is legible: use it sparingly for one word */
  .headline .hl {
    color: var(--lime);
  }
  .subline {
    margin-top: 44px;
    font-family: 'Raleway', sans-serif;
    font-weight: 500;
    font-size: 42px;
    line-height: 1.4;
    color: var(--muted);
    max-width: 760px;
  }

  /* Bottom: tagline eyebrow + CTA chip + wordmark */
  .footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 40px;
  }
  .tagline {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--lime);
  }
  /* Square lime CTA chip, ink text */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    background: var(--lime);
    color: var(--lime-text);
    font-family: 'Exo 2', sans-serif;
    font-weight: 800;
    font-size: 38px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 30px 56px;
    border: 0;
    border-radius: 0;
  }
  .cta .arrow { font-weight: 800; }

  .wordmark {
    height: 84px;
    width: auto;
  }
  .handle {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 22px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="slashes"></div>
    <img class="emblem" src="../brand-assets/icon-transparent.png" alt="" />
    <div class="inner">

      <!-- SECTION LABEL (swap freely) -->
      <div class="label"><span class="rule"></span><span class="txt">Ontario FRC / New Team</span></div>

      <!-- HEADLINE (swap me). Wrap one key word in <span class="hl"> for lime (legible on dark). -->
      <div class="main">
        <span class="accent-rule"></span>
        <h1 class="headline">Top 10 in<br /><span class="hl">Ontario.</span><br />Year one.</h1>

        <!-- SUBLINE (swap me) -->
        <p class="subline">No experience needed. We teach everything. You just have to show up.</p>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <div class="tagline">Innovate. Adapt. SHFT.</div>

        <!-- CTA (swap me) -->
        <div class="cta">Join SHFT <span class="arrow">&rarr;</span></div>

        <div>
          <img class="wordmark" src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS" />
          <div class="handle">@shftrobotics</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
