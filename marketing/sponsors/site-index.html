<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SHFT Robotics Sponsorship Package</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { background: #0b0b0b; color: #fff; font-family: -apple-system, 'Segoe UI', sans-serif; }
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; background: rgba(11,11,11,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #262626;
  }
  .bar img { height: 26px; width: auto; display: block; }
  .btn {
    display: inline-block; background: #A6FF00; color: #1A1A1A; text-decoration: none;
    font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 16px;
  }
  .stack { max-width: 920px; margin: 0 auto; padding: 16px 8px 40px; display: flex; flex-direction: column; gap: 12px; }
  .stack img { width: 100%; height: auto; display: block; border: 1px solid #262626; }
  .foot { text-align: center; padding: 8px 16px 48px; color: #737373; font-size: 13px; line-height: 1.7; }
  .foot a { color: #A6FF00; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="bar">
    <img src="brand-assets/wordmark-shft-robotics.png" alt="SHFT Robotics" />
    <a class="btn" href="shft-sponsorship-package.pdf" download="SHFT-Sponsorship-Package.pdf">Download PDF</a>
  </div>
  <div class="stack">
    <img src="pages/page-01.jpg" alt="Sponsor package page 1" />
    <img src="pages/page-02.jpg" alt="Sponsor package page 2" loading="lazy" />
    <img src="pages/page-03.jpg" alt="Sponsor package page 3" loading="lazy" />
    <img src="pages/page-04.jpg" alt="Sponsor package page 4" loading="lazy" />
    <img src="pages/page-05.jpg" alt="Sponsor package page 5" loading="lazy" />
    <img src="pages/page-06.jpg" alt="Sponsor package page 6" loading="lazy" />
    <img src="pages/page-07.jpg" alt="Sponsor package page 7" loading="lazy" />
  </div>
  <div class="foot">
    Questions or a custom package: <a href="mailto:team@shftrobotics.com">team@shftrobotics.com</a><br />
    <a href="shft-sponsorship-package.pdf" download="SHFT-Sponsorship-Package.pdf">Download the PDF</a>
  </div>
</body>
</html>
