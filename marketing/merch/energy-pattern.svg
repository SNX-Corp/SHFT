<?xml version="1.0" encoding="UTF-8"?>
<!--
  SHFT "Energy" supporting motif. ORIGINAL ART.
  A seamless tiling lightning / chevron pattern in SHFT Lime (#A6FF00) on
  SHFT Black (#1A1A1A). This is NOT the official SHFT mark or wordmark.
  Use as: sleeve print, packaging fill, banner/background texture, sticker sheet.
  Tile by referencing <pattern id="shft-energy"> or repeating the 240x240 unit.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480"
     viewBox="0 0 480 480" role="img"
     aria-label="SHFT energy pattern: an original lightning chevron motif, not the official logo">

  <defs>
    <!-- One 240x240 tile. The bolt + chevrons are positioned so edges
         line up across tile boundaries for seamless repetition. -->
    <pattern id="shft-energy" x="0" y="0" width="240" height="240"
             patternUnits="userSpaceOnUse">

      <!-- base -->
      <rect x="0" y="0" width="240" height="240" fill="#1A1A1A"/>

      <!-- faint structural chevrons (low opacity, sets the "charge" grid) -->
      <g fill="none" stroke="#A6FF00" stroke-width="2" opacity="0.14"
         stroke-linejoin="round" stroke-linecap="round">
        <polyline points="0,40 40,0 80,40 120,0 160,40 200,0 240,40"/>
        <polyline points="0,160 40,120 80,160 120,120 160,160 200,120 240,160"/>
      </g>

      <!-- diagonal energy hairlines threading the tile -->
      <g stroke="#A6FF00" stroke-width="2" opacity="0.10" stroke-linecap="round">
        <line x1="-20" y1="240" x2="240" y2="-20"/>
        <line x1="100" y1="260" x2="260" y2="100"/>
        <line x1="-40" y1="120" x2="120" y2="-40"/>
      </g>

      <!-- primary lightning bolt, top-left quadrant -->
      <path d="M 96 28 L 60 112 L 92 112 L 56 212 L 140 100 L 104 100 L 132 28 Z"
            fill="#A6FF00" opacity="0.92"/>

      <!-- secondary bolt, bottom-right quadrant (mirrored feel, offset) -->
      <path d="M 200 152 L 172 218 L 196 218 L 168 296 L 232 208 L 204 208 L 226 152 Z"
            fill="#A6FF00" opacity="0.55"/>

      <!-- small spark accents to break the grid -->
      <g fill="#A6FF00" opacity="0.85">
        <path d="M 30 150 L 22 168 L 31 168 L 23 188 L 44 162 L 35 162 L 41 150 Z"/>
        <path d="M 210 30 L 204 44 L 211 44 L 205 60 L 222 38 L 215 38 L 220 30 Z"
              opacity="0.6"/>
      </g>

      <!-- corner pips so tiles read as a continuous charged field -->
      <g fill="#A6FF00" opacity="0.5">
        <circle cx="0"   cy="0"   r="2.5"/>
        <circle cx="240" cy="0"   r="2.5"/>
        <circle cx="0"   cy="240" r="2.5"/>
        <circle cx="240" cy="240" r="2.5"/>
        <circle cx="120" cy="120" r="2"/>
      </g>
    </pattern>
  </defs>

  <!-- render the tile across a 480x480 swatch (2x2 repeat) so the seamless
       tiling is visible at a glance -->
  <rect x="0" y="0" width="480" height="480" fill="url(#shft-energy)"/>
</svg>
