<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Ad Creative: 1080x1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<!--
  SHFT Robotics: 1080x1080 ad creative template.
  Self-contained. Open in a browser, then screenshot the .canvas element
  (it is exactly 1080x1080) for a square Instagram/Facebook ad.

  SWAP THESE:
    - .hook   text  -> the main line ("Build robots. Compete. Win.")
    - .label  text  -> small top section label
    - .cta    text  -> the call to action button label
    - .meta   text  -> info-night / location line (or delete it)

  REAL BRAND: dark #1A1A1A ground, white Orbitron hook, one lime emphasis
  word, sharp square edges, lime is the one accent.
  No em dashes anywhere in copy.

  Screenshot tip (headless): a 1080x1080 viewport capture of .canvas
  produces a pixel-perfect feed-ready asset.
-->
<style>
  :root{
    --ink:#1A1A1A; --panel:#202020; --line:#333333;
    --white:#FFFFFF; --muted:#A3A3A3;
    --lime:#A6FF00; --lime-hover:#8FE000; --lime-text:#1A1A1A;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Raleway',sans-serif;
    padding:24px;
  }

  /* The exact export frame. Dark #1A1A1A ground. */
  .canvas{
    position:relative;
    width:1080px;
    height:1080px;
    background:#1A1A1A;
    overflow:hidden;
    color:var(--white);
    flex:0 0 auto;
  }

  /* Faint lime dot-grid watermark, lower-left corner */
  .pattern{
    position:absolute;
    left:-40px;
    bottom:-40px;
    width:420px;
    height:420px;
    background-image:radial-gradient(var(--lime) 2px, transparent 2px);
    background-size:30px 30px;
    opacity:0.10;
    z-index:1;
    pointer-events:none;
  }
  /* Emblem watermark, low opacity, top-right corner accent */
  .emblem{
    position:absolute;
    top:88px;
    right:90px;
    width:88px;
    height:auto;
    opacity:0.16;
    z-index:1;
    pointer-events:none;
  }

  /* Content stack */
  .stack{
    position:absolute;
    inset:0;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    z-index:2;
  }

  /* Top-right URL */
  .url{
    position:absolute;
    top:90px;
    right:90px;
    font-family:'Exo 2',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--muted);
    z-index:3;
  }

  /* Section label: lime rule then an Exo 2 label */
  .label{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:14px;
    margin-bottom:auto;
  }
  .label .rule{
    display:inline-block;
    width:40px; height:3px;
    background:var(--lime);
  }
  .label .txt{
    font-family:'Exo 2',sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* Short lime rule above the hook */
  .accent-rule{
    width:96px; height:6px;
    background:var(--lime);
    margin-bottom:40px;
  }

  .hook{
    font-family:'Orbitron',sans-serif;
    font-size:108px;
    line-height:0.96;
    font-weight:900;
    letter-spacing:-0.02em;
    text-transform:uppercase;
    color:var(--white);
    max-width:14ch;
  }
  /* On the dark ground, lime text is legible: use it for one emphasis word */
  .hook .hl{
    color:var(--lime);
  }

  .meta{
    margin-top:30px;
    font-family:'Raleway',sans-serif;
    font-size:30px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:0.01em;
  }

  /* Eyebrow tagline above the footer row */
  .tagline{
    margin-top:46px;
    font-family:'Exo 2',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--lime);
  }

  .footerrow{
    margin-top:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }

  /* Square lime CTA chip, ink text */
  .cta{
    display:inline-flex;
    align-items:center;
    gap:16px;
    background:var(--lime);
    color:var(--lime-text);
    font-family:'Exo 2',sans-serif;
    font-size:32px;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:22px 44px;
    border:0;
    border-radius:0;
  }
  .cta .arrow{ font-weight:800; }

  .wordmark{
    height:64px;
    width:auto;
  }
  /* Fallback text wordmark if PNG is missing */
  .wordmark-text{
    font-family:'Orbitron',sans-serif;
    font-size:46px;
    font-weight:900;
    letter-spacing:0.04em;
    color:var(--white);
  }
</style>
</head>
<body>
  <div class="canvas">

    <div class="pattern"></div>
    <img class="emblem" src="../brand-assets/icon-transparent.png" alt="" />

    <div class="url">shftrobotics.com</div>

    <div class="stack">
      <!-- SWAP: section label -->
      <span class="label"><span class="rule"></span><span class="txt">01 / New Ontario FRC Team</span></span>

      <!-- SWAP: hook (wrap one key word in .hl for lime, legible on dark) -->
      <span class="accent-rule"></span>
      <h1 class="hook">Build robots.<br /><span class="hl">Compete. Win.</span></h1>

      <!-- SWAP or delete: meta line (info night / location) -->
      <p class="meta">Recruiting students now in [FILL: city].</p>

      <!-- Tagline eyebrow -->
      <div class="tagline">Innovate. Adapt. SHFT.</div>

      <div class="footerrow">
        <!-- SWAP: CTA label -->
        <span class="cta">Join SHFT <span class="arrow">&#8594;</span></span>

        <!-- SHFT ROBOTICS wordmark (white + green on transparent). Falls back to text if missing. -->
        <img class="wordmark" src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\'wordmark-text\'>SHFT</span>');" />
      </div>
    </div>
  </div>
</body>
</html>
