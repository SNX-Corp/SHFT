<?xml version="1.0" encoding="UTF-8"?>
<!--
  SHFT ROBOTICS  |  STICKER: bolt-diecut
  Kiss-cut bolt sticker on transparent, with a white keyline halo around the bolt silhouette.
  Colors: WHITE #FFFFFF (halo backing), LIME #A6FF00 (bolt, spot Pantone 802 C / 809 C).
  CUT CONTOUR: the magenta (#FF00FF) 1pt path id="CutContour" follows the bolt-with-halo silhouette.
  This is a KISS-CUT: the vinyl face is cut to the contour, the backing liner is left whole.
  Canvas 600 x 600 user units; finished bolt height ~70 mm. Halo = white stroke offset ~28u outside the bolt.
  NOTE: the white halo here is rendered by a thick white stroke on a copy of the bolt path (round joins),
  which gives the classic die-cut sticker border. The magenta CutContour traces the outer edge of that halo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- transparent background: no fill rect on purpose -->

  <!-- bolt placed centered: source viewBox 541.12 151.81 454.23 719.97; scale 0.62, centered -->
  <g transform="translate(300 300) scale(0.62) translate(-768.235 -511.795)">

    <!-- CUT CONTOUR (outermost): magenta 1pt die line, traces the halo edge. Does not print. -->
    <path id="CutContour" d="M684.95,719.3l-103.4,113.02c-12.93,14.13-24.12,28.24-40.43,39.46l62.93-117.69,114.21-209.8-89.99,7.09,169-188.16,189.7-208.77c2.3-2.53,4.39-2.64,5.99-1.59,2.33,1.53,2.39,3.5,1,6.29l-56.97,114.27-90.09,175.1,91.91-5.95-140.81,152.91-113.04,123.83Z"
      fill="none" stroke="#FF00FF" stroke-width="60" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- WHITE HALO: thick white stroke + fill creates the keyline border -->
    <path d="M684.95,719.3l-103.4,113.02c-12.93,14.13-24.12,28.24-40.43,39.46l62.93-117.69,114.21-209.8-89.99,7.09,169-188.16,189.7-208.77c2.3-2.53,4.39-2.64,5.99-1.59,2.33,1.53,2.39,3.5,1,6.29l-56.97,114.27-90.09,175.1,91.91-5.95-140.81,152.91-113.04,123.83Z"
      fill="#FFFFFF" stroke="#FFFFFF" stroke-width="56" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- BOLT: lime artwork on top of the white halo -->
    <path d="M684.95,719.3l-103.4,113.02c-12.93,14.13-24.12,28.24-40.43,39.46l62.93-117.69,114.21-209.8-89.99,7.09,169-188.16,189.7-208.77c2.3-2.53,4.39-2.64,5.99-1.59,2.33,1.53,2.39,3.5,1,6.29l-56.97,114.27-90.09,175.1,91.91-5.95-140.81,152.91-113.04,123.83Z"
      fill="#A6FF00"/>
  </g>
</svg>
