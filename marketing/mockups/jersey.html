<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHFT ROBOTICS Team Kit 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A;
    --ink-2:#141414;
    --ink-3:#1A1A1A;
    --green:#A6FF00;
    --white:#FFFFFF;
    --grey:#A3A3A3;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#050505;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Raleway',sans-serif;
  }

  /* ============ STAGE ============ */
  .stage{
    position:relative;
    width:1600px;
    height:2000px;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 18%, rgba(166,255,0,.10) 0%, rgba(166,255,0,0) 42%),
      radial-gradient(140% 100% at 50% 110%, #000 0%, rgba(0,0,0,0) 55%),
      radial-gradient(90% 70% at 50% 44%, #1c1c1c 0%, #121212 38%, #0a0a0a 70%, #050505 100%);
    isolation:isolate;
  }

  /* ---- studio backdrop seam (floor / wall split) ---- */
  .floor{
    position:absolute;
    left:0; right:0; bottom:0;
    height:640px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 32%, rgba(0,0,0,.7) 100%),
      radial-gradient(70% 120% at 50% 0%, rgba(166,255,0,.07) 0%, rgba(166,255,0,0) 60%);
    z-index:2;
  }
  .floor::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:2px;
    background:linear-gradient(90deg, transparent, rgba(166,255,0,.55) 30%, rgba(166,255,0,.75) 50%, rgba(166,255,0,.55) 70%, transparent);
    box-shadow:0 0 24px rgba(166,255,0,.4);
  }

  /* ---- dot grid texture ---- */
  .dots{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(166,255,0,.16) 1.3px, transparent 1.4px);
    background-size:42px 42px;
    background-position:0 0;
    opacity:.20;
    mix-blend-mode:screen;
    z-index:1;
    mask-image:radial-gradient(80% 70% at 50% 42%, #000 0%, rgba(0,0,0,.2) 60%, transparent 85%);
    -webkit-mask-image:radial-gradient(80% 70% at 50% 42%, #000 0%, rgba(0,0,0,.2) 60%, transparent 85%);
  }

  /* ---- diagonal speed slashes ---- */
  .slashes{
    position:absolute; inset:-10%;
    background:repeating-linear-gradient(
      -64deg,
      rgba(166,255,0,0) 0px,
      rgba(166,255,0,0) 116px,
      rgba(166,255,0,.05) 116px,
      rgba(166,255,0,.05) 120px
    );
    mix-blend-mode:screen;
    z-index:1;
    mask-image:radial-gradient(70% 80% at 50% 40%, #000, transparent 75%);
    -webkit-mask-image:radial-gradient(70% 80% at 50% 40%, #000, transparent 75%);
  }

  /* ---- big green rim-light halo behind jersey ---- */
  .halo{
    position:absolute;
    left:50%; top:46%;
    width:1180px; height:1320px;
    transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 48%, rgba(166,255,0,.55) 0%, rgba(166,255,0,.22) 34%, rgba(166,255,0,0) 66%);
    filter:blur(26px);
    mix-blend-mode:screen;
    z-index:3;
  }
  .halo.rim{
    width:900px; height:1140px;
    background:radial-gradient(46% 52% at 50% 50%, rgba(166,255,0,0) 58%, rgba(166,255,0,.7) 70%, rgba(166,255,0,0) 82%);
    filter:blur(8px);
    opacity:.7;
  }

  /* ============ EYEBROW ============ */
  .eyebrow{
    position:absolute;
    left:50%; top:74px;
    transform:translateX(-50%);
    z-index:20;
    display:flex; align-items:center; gap:20px;
    text-align:center;
  }
  .eyebrow .line{ width:120px; height:2px;
    background:linear-gradient(90deg, transparent, var(--green)); }
  .eyebrow .line.r{ background:linear-gradient(90deg, var(--green), transparent); }
  .eyebrow .tag{
    font-family:'Exo 2',sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:.46em;
    text-transform:uppercase;
    color:var(--white);
    padding-left:.46em;
    text-shadow:0 0 18px rgba(166,255,0,.35);
  }
  .eyebrow .tag b{ color:var(--green); font-weight:800;
    text-shadow:0 0 22px rgba(166,255,0,.8); }

  /* ============ JERSEY ============ */
  .jersey-wrap{
    position:absolute;
    left:50%; top:172px;
    transform:translateX(-50%);
    z-index:10;
    width:1040px;
    height:1230px;
    perspective:2200px;
  }
  .jersey{
    position:relative;
    width:100%; height:100%;
    transform:rotateX(7deg) rotateY(-3deg);
    transform-style:preserve-3d;
    filter:drop-shadow(0 60px 70px rgba(0,0,0,.75)) drop-shadow(0 0 60px rgba(166,255,0,.18));
  }

  /* torso body */
  .body{
    position:absolute;
    left:140px; right:140px;
    top:150px; bottom:0;
    border-radius:26px 26px 60px 60px / 18px 18px 120px 120px;
    background:
      linear-gradient(100deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 16%),
      linear-gradient(255deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 24%),
      radial-gradient(120% 90% at 50% 8%, #2a2d2e 0%, #1d1f20 30%, #141516 62%, #0d0e0e 100%);
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,.06),
      inset 0 -40px 90px rgba(0,0,0,.6),
      inset 80px 0 140px rgba(0,0,0,.45),
      inset -80px 0 140px rgba(0,0,0,.45);
    overflow:hidden;
  }
  /* center seam + fabric sheen lines */
  .body::before{
    content:"";
    position:absolute; left:50%; top:0; bottom:0; width:2px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%);
  }
  .body::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(118deg, transparent 30%, rgba(255,255,255,.05) 47%, transparent 56%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 3px, transparent 3px 7px);
    mix-blend-mode:screen;
  }

  /* green diagonal accent panel across lower body */
  .accent-band{
    position:absolute;
    left:-40px; right:-40px;
    bottom:120px;
    height:230px;
    background:linear-gradient(180deg, rgba(166,255,0,.0), rgba(166,255,0,.14));
    transform:skewY(-7deg);
    border-top:3px solid rgba(166,255,0,.85);
    box-shadow:0 0 40px rgba(166,255,0,.3);
    mix-blend-mode:screen;
    z-index:2;
  }
  .accent-hair{
    position:absolute;
    left:-40px; right:-40px;
    bottom:330px;
    height:2px;
    background:linear-gradient(90deg, transparent, rgba(166,255,0,.7), transparent);
    transform:skewY(-7deg);
    z-index:2;
  }

  /* shoulders / sleeves */
  .sleeve{
    position:absolute;
    top:108px;
    width:235px; height:320px;
    background:
      linear-gradient(255deg, rgba(0,0,0,.55), rgba(0,0,0,0) 40%),
      radial-gradient(120% 120% at 50% 0%, #26292a 0%, #181a1b 45%, #0e0f10 100%);
    box-shadow:inset 0 -30px 60px rgba(0,0,0,.5);
    z-index:1;
  }
  .sleeve.l{
    left:0;
    transform:rotate(-18deg);
    transform-origin:top right;
    border-radius:60px 30px 90px 80px;
    clip-path:polygon(38% 0,100% 0,100% 62%,52% 100%,0 78%);
  }
  .sleeve.r{
    right:0;
    transform:rotate(18deg);
    transform-origin:top left;
    border-radius:30px 60px 80px 90px;
    clip-path:polygon(0 0,62% 0,100% 78%,48% 100%,0 62%);
  }
  /* sleeve green cuffs */
  .cuff{
    position:absolute;
    bottom:34px; height:30px; width:70%;
    background:linear-gradient(90deg, transparent, var(--green), transparent);
    box-shadow:0 0 24px rgba(166,255,0,.6);
    opacity:.9;
  }
  .sleeve.l .cuff{ left:6%; transform:skewX(20deg); }
  .sleeve.r .cuff{ right:6%; transform:skewX(-20deg); }

  /* sleeve bolt */
  .sleeve-bolt{
    position:absolute;
    width:74px; height:118px;
    top:66px;
    filter:drop-shadow(0 0 16px rgba(166,255,0,.85));
    z-index:3;
  }
  .sleeve.r .sleeve-bolt{ right:64px; transform:rotate(18deg); }

  /* collar */
  .collar{
    position:absolute;
    left:50%; top:118px;
    transform:translateX(-50%);
    width:300px; height:120px;
    z-index:4;
  }
  .collar .v{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 90% at 50% 0%, #0a0b0b 0%, #121313 60%, transparent 72%);
    clip-path:polygon(0 0,100% 0,72% 0,50% 78%,28% 0);
  }
  .collar .trim{
    position:absolute; left:50%; top:0;
    transform:translateX(-50%);
    width:228px; height:96px;
    clip-path:polygon(0 0,16% 0,50% 70%,84% 0,100% 0,50% 96%);
    background:linear-gradient(180deg, var(--green), rgba(166,255,0,.2));
    box-shadow:0 0 26px rgba(166,255,0,.55);
    opacity:.92;
  }
  .collar .trim::after{
    content:""; position:absolute; inset:6px;
    background:#0c0d0d;
    clip-path:polygon(0 0,18% 0,50% 66%,82% 0,100% 0,50% 90%);
  }

  /* chest wordmark */
  .chest-mark{
    position:absolute;
    left:50%; top:330px;
    transform:translateX(-50%);
    width:560px;
    z-index:6;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(166,255,0,.28));
  }
  .chest-mark img{ width:100%; display:block; }
  /* fabric press shadow under wordmark */
  .chest-mark::after{
    content:""; position:absolute; inset:-30px -50px;
    background:radial-gradient(60% 60% at 50% 50%, rgba(0,0,0,.28), transparent 70%);
    z-index:-1;
  }

  /* big jersey number */
  .number{
    position:absolute;
    left:50%; top:678px;
    transform:translateX(-50%);
    z-index:6;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:188px;
    line-height:.78;
    letter-spacing:-.04em;
    white-space:nowrap;
    color:transparent;
    -webkit-text-stroke:2px rgba(255,255,255,.16);
    background:linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(166,255,0,.95) 54%, rgba(120,190,0,.7) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    text-shadow:0 0 60px rgba(166,255,0,.35);
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
  }
  .number small{
    font-size:188px;
    -webkit-text-stroke:2px rgba(166,255,0,.45);
  }

  /* hem sponsor row */
  .hem{
    position:absolute;
    left:50%; bottom:62px;
    transform:translateX(-50%);
    z-index:6;
    display:flex; align-items:center; gap:30px;
    font-family:'Exo 2',sans-serif;
  }
  .sponsor{
    font-weight:800;
    font-size:30px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(255,255,255,.78);
    text-shadow:0 1px 0 rgba(0,0,0,.6);
  }
  .sponsor.g{ color:var(--green); text-shadow:0 0 14px rgba(166,255,0,.5); }
  .hem .dot{ width:7px; height:7px; background:var(--green);
    transform:rotate(45deg); box-shadow:0 0 12px rgba(166,255,0,.7); }

  /* ============ FLOOR REFLECTION ============ */
  .reflection{
    position:absolute;
    left:50%; top:1402px;
    transform:translateX(-50%) scaleY(-1);
    width:1040px; height:1230px;
    z-index:4;
    opacity:.22;
    filter:blur(2px);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.65) 28%, rgba(0,0,0,0) 64%);
    mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.65) 28%, rgba(0,0,0,0) 64%);
    pointer-events:none;
  }
  .reflection img{ width:100%; }

  /* ============ FOOTER ============ */
  .footer{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:25;
    padding:0 90px 64px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }
  .slogan{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:40px;
    line-height:1.08;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--white);
    text-shadow:0 0 24px rgba(0,0,0,.8);
  }
  .slogan b{ color:var(--green);
    text-shadow:0 0 22px rgba(166,255,0,.7),0 0 4px rgba(166,255,0,.9); }
  .slogan .sub{
    display:block;
    margin-top:14px;
    font-family:'Raleway',sans-serif;
    font-weight:500;
    font-size:19px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--grey);
    text-shadow:none;
  }
  .kit-chip{
    text-align:right;
    font-family:'Exo 2',sans-serif;
  }
  .kit-chip .yr{
    display:inline-block;
    border:2px solid rgba(166,255,0,.7);
    color:var(--green);
    font-weight:800;
    font-size:22px;
    letter-spacing:.18em;
    padding:9px 18px;
    background:rgba(166,255,0,.05);
    box-shadow:0 0 24px rgba(166,255,0,.18), inset 0 0 24px rgba(166,255,0,.06);
  }
  .kit-chip .meta{
    display:block;
    margin-top:14px;
    font-family:'Raleway',sans-serif;
    font-weight:500;
    font-size:16px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--grey);
  }

  /* corner frame ticks (square chrome) */
  .tick{ position:absolute; z-index:24; width:46px; height:46px; }
  .tick i{ position:absolute; background:rgba(166,255,0,.55);
    box-shadow:0 0 10px rgba(166,255,0,.4); }
  .tick i.h{ height:2px; width:46px; }
  .tick i.v{ width:2px; height:46px; }
  .tick.tl{ left:46px; top:46px; }
  .tick.tr{ right:46px; top:46px; }
  .tick.bl{ left:46px; bottom:46px; }
  .tick.br{ right:46px; bottom:46px; }
  .tick.tr i.v{ right:0; } .tick.tr i.h{ right:0; }
  .tick.bl i.v{ bottom:0; } .tick.bl i.h{ bottom:0; }
  .tick.br i.v{ right:0;bottom:0; } .tick.br i.h{ right:0;bottom:0; }

  /* vertical side label */
  .side-label{
    position:absolute;
    left:54px; top:50%;
    transform:translateY(-50%) rotate(180deg);
    writing-mode:vertical-rl;
    z-index:24;
    font-family:'Exo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(163,163,163,.6);
  }
  .side-label.r{ left:auto; right:54px; transform:translateY(-50%) rotate(0deg); }

  /* ============ GRAIN ============ */
  .grain{
    position:absolute; inset:0; z-index:40;
    opacity:.06; mix-blend-mode:overlay; pointer-events:none;
  }
  /* top + bottom vignette */
  .vignette{
    position:absolute; inset:0; z-index:38; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 40%, transparent 52%, rgba(0,0,0,.45) 88%, rgba(0,0,0,.7) 100%);
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- background texture layers -->
    <div class="slashes"></div>
    <div class="dots"></div>
    <div class="halo"></div>
    <div class="halo rim"></div>
    <div class="floor"></div>

    <!-- frame ticks -->
    <div class="tick tl"><i class="h"></i><i class="v"></i></div>
    <div class="tick tr"><i class="h"></i><i class="v"></i></div>
    <div class="tick bl"><i class="h"></i><i class="v"></i></div>
    <div class="tick br"><i class="h"></i><i class="v"></i></div>
    <div class="side-label">SHFT ROBOTICS // FRC 7558</div>
    <div class="side-label r">WE DON'T FOLLOW. WE SHFT.</div>

    <!-- eyebrow -->
    <div class="eyebrow">
      <span class="line"></span>
      <span class="tag">TEAM <b>KIT</b> 2026</span>
      <span class="line r"></span>
    </div>

    <!-- floor reflection (mirror of jersey) -->
    <div class="reflection">
      <div class="jersey">
        <div class="sleeve l"></div>
        <div class="sleeve r">
          <img class="sleeve-bolt" src="../brand-assets/bolt.svg" alt="">
          <div class="cuff"></div>
        </div>
        <div class="body">
          <div class="accent-hair"></div>
          <div class="accent-band"></div>
        </div>
        <div class="chest-mark"><img src="../brand-assets/wordmark-shft-robotics.png" alt=""></div>
        <div class="number">75<small>58</small></div>
      </div>
    </div>

    <!-- the jersey -->
    <div class="jersey-wrap">
      <div class="jersey">

        <!-- sleeves -->
        <div class="sleeve l">
          <div class="cuff"></div>
        </div>
        <div class="sleeve r">
          <img class="sleeve-bolt" src="../brand-assets/bolt.svg" alt="SHFT bolt">
          <div class="cuff"></div>
        </div>

        <!-- torso -->
        <div class="body">
          <div class="accent-hair"></div>
          <div class="accent-band"></div>
        </div>

        <!-- collar -->
        <div class="collar">
          <div class="v"></div>
          <div class="trim"></div>
        </div>

        <!-- chest wordmark -->
        <div class="chest-mark">
          <img src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS">
        </div>

        <!-- big number -->
        <div class="number">75<small>58</small></div>

        <!-- hem sponsors -->
        <div class="hem">
          <span class="sponsor g">ALT-F4</span>
          <span class="dot"></span>
          <span class="sponsor">WCP</span>
        </div>

      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="slogan">
        WE DON'T FOLLOW.<br><b>WE SHFT.</b>
        <span class="sub">Building the future one shift at a time.</span>
      </div>
      <div class="kit-chip">
        <span class="yr">SEASON 2026</span>
        <span class="meta">Innovate. Adapt. SHFT.</span>
      </div>
    </div>

    <!-- atmosphere -->
    <div class="vignette"></div>

    <!-- grain overlay (inline SVG turbulence) -->
    <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#grain)"/>
    </svg>

  </div>
</body>
</html>
