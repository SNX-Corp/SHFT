<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Post Template (1080x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
    SHFT POST TEMPLATE  ·  1080 x 1080  (1:1)
    --------------------------------------------------------------
    HOW TO USE
    1. Open this file in Chrome.
    2. Edit the three swappable lines below in the HTML:
         - .headline   (Orbitron, big)
         - .subline    (the supporting line)
         - .cta        (the square button text)
    3. Screenshot the .frame at full size and crop to the frame edges.
       A 1080x1080 emulation gives a clean grab.
    --------------------------------------------------------------
    REAL BRAND: dark #1A1A1A ground, white Orbitron headline, one lime
    emphasis word, sharp square edges, lime is the one accent.
    No em dashes anywhere in copy.
  */
  :root {
    --ink:#1A1A1A; --panel:#202020; --line:#333333;
    --white:#FFFFFF; --muted:#A3A3A3;
    --lime:#A6FF00; --lime-hover:#8FE000; --lime-text:#1A1A1A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Raleway', sans-serif;
  }

  /* The capture frame. Screenshot exactly this. Dark #1A1A1A ground. */
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #1A1A1A;
    overflow: hidden;
    color: var(--white);
    display: flex;
  }

  /* Faint lime dot-grid watermark in the lower-right corner */
  .pattern {
    position: absolute;
    right: -40px;
    bottom: -40px;
    width: 420px;
    height: 420px;
    background-image: radial-gradient(var(--lime) 2px, transparent 2px);
    background-size: 30px 30px;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  /* Emblem watermark, low opacity, top-right corner accent */
  .emblem {
    position: absolute;
    top: 70px;
    right: 80px;
    width: 92px;
    height: auto;
    opacity: 0.16;
    z-index: 1;
    pointer-events: none;
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 88px 92px 80px;
  }

  /* Top row: section label + handle */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .label .rule {
    display: inline-block;
    width: 40px; height: 3px;
    background: var(--lime);
  }
  .label .txt {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .handle {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* Headline block, centered vertically */
  .main {
    margin-top: auto;
    margin-bottom: auto;
  }
  /* Short lime rule above the headline */
  .accent-rule {
    width: 96px; height: 6px;
    background: var(--lime);
    margin-bottom: 40px;
  }
  .headline {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 104px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--white);
  }
  /* On the dark ground, lime text is legible: use it for one emphasis word */
  .headline .hl {
    color: var(--lime);
  }
  .subline {
    margin-top: 36px;
    font-family: 'Raleway', sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.35;
    color: var(--muted);
    max-width: 720px;
  }

  /* Eyebrow tagline above the footer */
  .tagline {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 30px;
  }

  /* Bottom row: CTA + wordmark */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  /* Square lime CTA chip, ink text */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--lime);
    color: var(--lime-text);
    font-family: 'Exo 2', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 22px 44px;
    border: 0;
    border-radius: 0;
  }
  .cta .arrow { font-weight: 800; }
  .wordmark {
    height: 64px;
    width: auto;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="pattern"></div>
    <img class="emblem" src="../brand-assets/icon-transparent.png" alt="" />
    <div class="inner">

      <!-- TOP ROW: section label + handle -->
      <div class="top">
        <div class="label">
          <span class="rule"></span>
          <!-- SECTION LABEL (swap freely) -->
          <span class="txt">01 / New Ontario FRC Team</span>
        </div>
        <div class="handle">@shftrobotics</div>
      </div>

      <!-- HEADLINE (swap me). Wrap one key word in <span class="hl"> for lime (legible on dark). -->
      <div class="main">
        <span class="accent-rule"></span>
        <h1 class="headline">Shift the<br /><span class="hl">standard.</span></h1>

        <!-- SUBLINE (swap me) -->
        <p class="subline">Built to compete from day one. No experience needed.</p>
      </div>

      <!-- FOOTER -->
      <div>
        <div class="tagline">Innovate. Build. Compete.</div>
        <div class="footer">
          <!-- CTA (swap me) -->
          <div class="cta">Join SHFT <span class="arrow">&rarr;</span></div>
          <img class="wordmark" src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS" />
        </div>
      </div>

    </div>
  </div>
</body>
</html>
