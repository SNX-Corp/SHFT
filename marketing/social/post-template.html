<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Post Template (1080x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
    SHFT POST TEMPLATE  ·  1080 x 1080  (1:1)
    --------------------------------------------------------------
    HOW TO USE
    1. Open this file in Chrome.
    2. Edit the three swappable lines below in the HTML:
         - .headline   (Orbitron, big)
         - .subline    (the supporting line)
         - .cta        (the pill button text)
    3. Screenshot the lime-bordered frame at full size and crop
       to the frame edges. A 1080x1080 emulation gives a clean grab.
    --------------------------------------------------------------
    BRAND
      Lime  #A6FF00   ·   Black #1A1A1A   ·   White #FFFFFF
      Headline = Orbitron (heavy, uppercase)
    No em dashes anywhere in copy.
  */
  :root {
    --lime: #A6FF00;
    --lime-dim: #5A8C00;
    --black: #1A1A1A;
    --white: #FFFFFF;
    --grey: #737373;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Raleway', sans-serif;
  }

  /* The capture frame. Screenshot exactly this. */
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    background:
      radial-gradient(115% 90% at 0% 0%, #232323 0%, var(--black) 55%, #0E0E0E 100%);
    overflow: hidden;
    color: var(--white);
    display: flex;
  }

  /* Lime energy glow, top-left */
  .frame::before {
    content: "";
    position: absolute;
    top: -300px; left: -200px;
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(166,255,0,0.16) 0%, rgba(166,255,0,0) 62%);
    pointer-events: none;
  }
  /* Faint grid texture */
  .frame::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 72px 72px;
    pointer-events: none;
  }

  /* Lime accent edge, left side */
  .edge {
    position: absolute;
    top: 0; left: 0;
    width: 14px; height: 100%;
    background: var(--lime);
    box-shadow: 0 0 30px rgba(166,255,0,0.5);
    z-index: 3;
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 84px 88px 80px 96px;
  }

  /* Top row: kicker + handle */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .kicker {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--lime);
  }
  .handle {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    color: var(--grey);
  }

  /* Headline block, centered vertically */
  .main {
    margin-top: auto;
    margin-bottom: auto;
  }
  .bolt {
    display: inline-block;
    width: 48px; height: 76px;
    margin-bottom: 28px;
    background: var(--lime);
    clip-path: polygon(58% 0, 12% 56%, 46% 56%, 30% 100%, 92% 40%, 54% 40%);
    filter: drop-shadow(0 0 22px rgba(166,255,0,0.55));
  }
  .headline {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 100px;
    line-height: 0.98;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  .headline .hl {
    color: var(--lime);
    text-shadow: 0 0 34px rgba(166,255,0,0.35);
  }
  .subline {
    margin-top: 34px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 1.3;
    color: #E8E8E8;
    max-width: 720px;
  }

  /* Bottom row: CTA + wordmark */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--lime);
    color: var(--black);
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 22px 44px;
    border-radius: 99px;
    box-shadow: 0 0 34px rgba(166,255,0,0.35);
  }
  .cta .arrow { font-weight: 900; }
  .wordmark {
    height: 66px;
    width: auto;
    opacity: 0.96;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="edge"></div>
    <div class="inner">

      <!-- TOP ROW -->
      <div class="top">
        <!-- KICKER (swap freely) -->
        <div class="kicker">New Ontario FRC Team</div>
        <div class="handle">@shftrobotics</div>
      </div>

      <!-- HEADLINE (swap me). Wrap key words in <span class="hl"> for lime. -->
      <div class="main">
        <span class="bolt"></span>
        <h1 class="headline">Shift the<br /><span class="hl">standard.</span></h1>

        <!-- SUBLINE (swap me) -->
        <p class="subline">Built to compete from day one. No experience needed.</p>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <!-- CTA (swap me) -->
        <div class="cta">Join SHFT <span class="arrow">&rarr;</span></div>
        <img class="wordmark" src="../../website/public/images/logo/wordmark.png" alt="SHFT" />
      </div>

    </div>
  </div>
</body>
</html>
