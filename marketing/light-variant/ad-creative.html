<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Ad Creative: 1080x1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<!--
  SHFT Robotics: 1080x1080 ad creative template.
  Self-contained. Open in a browser, then screenshot the .canvas element
  (it is exactly 1080x1080) for a square Instagram/Facebook ad.

  SWAP THESE:
    - .hook   text  -> the main line ("Build robots. Compete. Win.")
    - .label  text  -> small top section label
    - .cta    text  -> the call to action button label
    - .meta   text  -> info-night / location line (or delete it)

  REAL BRAND: white canvas, sharp square edges, type first, lime is rare.
  No em dashes anywhere in copy.

  Screenshot tip (headless): a 1080x1080 viewport capture of .canvas
  produces a pixel-perfect feed-ready asset.
-->
<style>
  :root{
    --bg:#FFFFFF; --surface:#F8F8F8; --ink:#1A1A1A; --border:#E5E5E5;
    --secondary:#555555; --muted:#737373;
    --lime:#A6FF00; --lime-hover:#8FE000; --lime-text:#1A1A1A; --lime-dim:#5A8C00;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#F8F8F8;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Raleway',sans-serif;
    padding:24px;
  }

  /* The exact export frame. White canvas. */
  .canvas{
    position:relative;
    width:1080px;
    height:1080px;
    background:#FFFFFF;
    overflow:hidden;
    color:var(--ink);
    flex:0 0 auto;
  }

  /* Content stack */
  .stack{
    position:absolute;
    inset:0;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    z-index:2;
  }

  /* Top-right URL */
  .url{
    position:absolute;
    top:90px;
    right:90px;
    font-family:'Exo 2',sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--muted);
    z-index:3;
  }

  /* Section label: lime rule then an Exo 2 label */
  .label{
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:14px;
    margin-bottom:auto;
  }
  .label .rule{
    display:inline-block;
    width:40px; height:3px;
    background:var(--lime);
  }
  .label .txt{
    font-family:'Exo 2',sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* Short lime rule above the hook */
  .accent-rule{
    width:96px; height:6px;
    background:var(--lime);
    margin-bottom:40px;
  }

  .hook{
    font-family:'Orbitron',sans-serif;
    font-size:108px;
    line-height:0.96;
    font-weight:900;
    letter-spacing:-0.02em;
    text-transform:uppercase;
    color:var(--ink);
    max-width:14ch;
  }
  /* Emphasis on white = ink word with a lime underline rule */
  .hook .hl{
    color:var(--ink);
    box-shadow:inset 0 -0.1em 0 var(--lime);
  }

  .meta{
    margin-top:30px;
    font-family:'Raleway',sans-serif;
    font-size:30px;
    font-weight:500;
    color:var(--secondary);
    letter-spacing:0.01em;
  }

  .footerrow{
    margin-top:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }

  /* Square lime CTA chip, ink text */
  .cta{
    display:inline-flex;
    align-items:center;
    gap:16px;
    background:var(--lime);
    color:var(--lime-text);
    font-family:'Exo 2',sans-serif;
    font-size:32px;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:22px 44px;
    border:0;
    border-radius:0;
  }
  .cta .arrow{ font-weight:800; }

  .wordmark{
    height:91px;
    width:auto;
  }
  /* Fallback text wordmark if PNG is missing */
  .wordmark-text{
    font-family:'Orbitron',sans-serif;
    font-size:46px;
    font-weight:900;
    letter-spacing:0.04em;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="canvas">

    <div class="url">shftrobotics.com</div>

    <div class="stack">
      <!-- SWAP: section label -->
      <span class="label"><span class="rule"></span><span class="txt">01 / New Ontario FRC Team</span></span>

      <!-- SWAP: hook (use .hl span for a lime underline) -->
      <span class="accent-rule"></span>
      <h1 class="hook">Build robots.<br /><span class="hl">Compete. Win.</span></h1>

      <!-- SWAP or delete: meta line (info night / location) -->
      <p class="meta">Recruiting students now in [FILL: city].</p>

      <div class="footerrow">
        <!-- SWAP: CTA label -->
        <span class="cta">Join SHFT <span class="arrow">&#8594;</span></span>

        <!-- Dark wordmark on white. Falls back to text if missing. -->
        <img class="wordmark" src="../_site/images/logo/wordmark-dark.png" alt="SHFT"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\'wordmark-text\'>SHFT</span>');" />
      </div>
    </div>
  </div>
</body>
</html>
