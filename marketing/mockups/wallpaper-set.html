<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHFT ROBOTICS // Phone Wallpaper Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0A0A0A;
    --bg1:#1A1A1A;
    --green:#A6FF00;
    --white:#FFFFFF;
    --grey:#A3A3A3;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#050505; }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Raleway',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= STAGE ================= */
  .stage{
    position:relative;
    width:1600px;
    height:1200px;
    overflow:hidden;
    background:
      radial-gradient(130% 110% at 50% 36%, #1A1A1A 0%, #121212 34%, #0A0A0A 64%, #050505 100%);
    isolation:isolate;
  }

  /* ---- big ambient green wash behind the phones ---- */
  .ambient{
    position:absolute;
    left:50%; top:44%;
    width:1400px; height:1000px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse 50% 50% at 50% 50%,
      rgba(166,255,0,0.22) 0%, rgba(166,255,0,0.09) 34%, rgba(166,255,0,0) 64%);
    mix-blend-mode:screen;
    filter:blur(14px);
    z-index:1;
    pointer-events:none;
  }
  .ambient-2{
    position:absolute;
    left:50%; top:50%;
    width:760px; height:760px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(166,255,0,0.18) 0%, rgba(166,255,0,0) 60%);
    mix-blend-mode:screen;
    filter:blur(10px);
    z-index:1;
    pointer-events:none;
  }

  /* ---- faint dot grid ---- */
  .dotgrid{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(166,255,0,0.10) 1.1px, transparent 1.2px);
    background-size:36px 36px;
    mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(120% 100% at 50% 44%, #000 0%, rgba(0,0,0,0.32) 50%, transparent 80%);
            mask-image:radial-gradient(120% 100% at 50% 44%, #000 0%, rgba(0,0,0,0.32) 50%, transparent 80%);
    z-index:1;
    pointer-events:none;
  }

  /* ---- diagonal speed slashes (green) ---- */
  .slashes{
    position:absolute; inset:-10%;
    background-image:repeating-linear-gradient(
      -32deg,
      transparent 0px,
      transparent 56px,
      rgba(166,255,0,0.045) 56px,
      rgba(166,255,0,0.045) 60px,
      transparent 60px,
      transparent 128px
    );
    mix-blend-mode:screen;
    -webkit-mask-image:linear-gradient(105deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
            mask-image:linear-gradient(105deg, transparent 0%, #000 24%, #000 76%, transparent 100%);
    z-index:1;
    pointer-events:none;
  }

  /* ---- top spotlight cone ---- */
  .spotlight{
    position:absolute;
    left:50%; top:-220px;
    width:1100px; height:1100px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse 40% 60% at 50% 30%,
      rgba(255,255,255,0.06) 0%, rgba(166,255,0,0.05) 30%, rgba(166,255,0,0) 64%);
    -webkit-mask-image:linear-gradient(#000 0%, rgba(0,0,0,0.4) 64%, transparent 94%);
            mask-image:linear-gradient(#000 0%, rgba(0,0,0,0.4) 64%, transparent 94%);
    mix-blend-mode:screen;
    filter:blur(6px);
    z-index:1;
    pointer-events:none;
  }

  /* ================= PHONE STAGE ================= */
  .phones{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-52%);
    width:1340px; height:920px;
    z-index:5;
    perspective:2200px;
    transform-style:preserve-3d;
  }

  /* ---- generic phone frame ---- */
  .phone{
    position:absolute;
    width:360px;
    height:760px;
    border-radius:54px;
    background:
      linear-gradient(150deg, #2a2a2a 0%, #161616 26%, #0d0d0d 60%, #050505 100%);
    padding:13px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.06) inset,
      0 -2px 0 rgba(0,0,0,0.6) inset,
      0 50px 80px rgba(0,0,0,0.66),
      0 18px 40px rgba(0,0,0,0.55);
    transform-style:preserve-3d;
  }
  /* metallic rail highlight running down the edges */
  .phone::before{
    content:"";
    position:absolute; inset:2px;
    border-radius:52px;
    background:linear-gradient(118deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0) 16%,
      rgba(255,255,255,0) 82%,
      rgba(166,255,0,0.10) 100%);
    pointer-events:none;
    z-index:6;
    mix-blend-mode:screen;
  }
  /* side buttons (square edges = brand chrome) */
  .phone .btn-vol{
    position:absolute; left:-3px; top:170px;
    width:3px; height:130px;
    background:linear-gradient(#3a3a3a,#1a1a1a);
    border-radius:2px;
  }
  .phone .btn-pwr{
    position:absolute; right:-3px; top:210px;
    width:3px; height:96px;
    background:linear-gradient(#3a3a3a,#1a1a1a);
    border-radius:2px;
  }

  /* ---- the actual screen ---- */
  .screen{
    position:relative;
    width:100%; height:100%;
    border-radius:42px;
    overflow:hidden;
    background:#070707;
    box-shadow:0 0 0 2px rgba(0,0,0,0.9) inset;
  }
  /* notch / pill cutout */
  .notch{
    position:absolute;
    left:50%; top:18px;
    transform:translateX(-50%);
    width:108px; height:30px;
    background:#000;
    border-radius:16px;
    z-index:9;
    box-shadow:0 0 0 1px rgba(255,255,255,0.04);
  }
  .notch::after{
    content:"";
    position:absolute; right:18px; top:50%;
    transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1f3a00, #050a00 70%);
    box-shadow:0 0 4px rgba(166,255,0,0.4);
  }
  /* screen glass sheen */
  .screen-glass{
    position:absolute; inset:0;
    z-index:8;
    pointer-events:none;
    background:linear-gradient(122deg,
      rgba(255,255,255,0.10) 0%,
      rgba(255,255,255,0) 24%,
      rgba(255,255,255,0) 76%,
      rgba(255,255,255,0.04) 100%);
    mix-blend-mode:screen;
  }

  /* ---- lock-screen status row ---- */
  .status{
    position:absolute;
    left:0; right:0; top:14px;
    z-index:7;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 30px;
    font-family:'Exo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.85);
  }
  .status .sig{ display:inline-flex; gap:9px; align-items:center; }
  .status .bars{ display:inline-flex; gap:2px; align-items:flex-end; height:11px; }
  .status .bars i{ width:2.5px; background:rgba(255,255,255,0.85); }
  .status .bars i:nth-child(1){ height:4px;}
  .status .bars i:nth-child(2){ height:6px;}
  .status .bars i:nth-child(3){ height:8px;}
  .status .bars i:nth-child(4){ height:11px;}
  .status .batt{
    width:22px; height:11px; border:1.5px solid rgba(255,255,255,0.7);
    border-radius:3px; position:relative; padding:1.5px;
  }
  .status .batt::after{
    content:""; position:absolute; right:-3px; top:3px;
    width:2px; height:5px; background:rgba(255,255,255,0.7); border-radius:0 1px 1px 0;
  }
  .status .batt i{ display:block; height:100%; width:78%; background:var(--green); border-radius:1px; }

  /* ---- big lock clock ---- */
  .clock{
    position:absolute;
    left:0; right:0; top:78px;
    z-index:7;
    text-align:center;
    color:#fff;
  }
  .clock .day{
    font-family:'Exo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.20em;
    color:rgba(255,255,255,0.72);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .clock .time{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:74px;
    line-height:0.92;
    letter-spacing:0.02em;
    text-shadow:0 0 18px rgba(255,255,255,0.18);
  }

  /* ---- lock-screen bottom dock ---- */
  .dock{
    position:absolute;
    left:0; right:0; bottom:30px;
    z-index:7;
    display:flex; align-items:center; justify-content:center;
    gap:74px;
  }
  .dock .key{
    width:46px; height:46px;
    border-radius:14px;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  .dock .key svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; }
  .swipe{
    position:absolute;
    left:50%; bottom:14px;
    transform:translateX(-50%);
    width:96px; height:5px; border-radius:3px;
    background:rgba(255,255,255,0.85);
    z-index:7;
  }

  /* ================= WALLPAPER A : GIANT BOLT ================= */
  .wp{ position:absolute; inset:0; overflow:hidden; }
  .wp-a{
    background:radial-gradient(120% 90% at 50% 52%, #121b00 0%, #0a0d02 36%, #050505 74%);
  }
  .wp-a .a-glow{
    position:absolute; left:50%; top:53%;
    width:340px; height:340px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(166,255,0,0.55) 0%, rgba(166,255,0,0.12) 38%, rgba(166,255,0,0) 66%);
    mix-blend-mode:screen; filter:blur(6px);
  }
  .wp-a .a-bolt{
    position:absolute; left:50%; top:53%;
    width:210px; height:333px;
    transform:translate(-50%,-50%);
    filter:
      drop-shadow(0 0 4px rgba(166,255,0,0.95))
      drop-shadow(0 0 16px rgba(166,255,0,0.85))
      drop-shadow(0 0 40px rgba(166,255,0,0.6))
      drop-shadow(0 0 90px rgba(166,255,0,0.4));
  }
  .wp-a .a-bolt img{ width:100%; height:100%; display:block; }
  /* gloss sheen on the bolt */
  .wp-a .a-sheen{
    position:absolute; left:50%; top:53%;
    width:210px; height:333px;
    transform:translate(-50%,-50%);
    background:linear-gradient(120deg, rgba(255,255,255,0) 34%, rgba(255,255,255,0.85) 48%, rgba(255,255,255,0) 56%);
    -webkit-mask:url('../brand-assets/bolt.svg') center/contain no-repeat;
            mask:url('../brand-assets/bolt.svg') center/contain no-repeat;
    mix-blend-mode:screen; opacity:0.85;
  }
  .wp-a .a-tag{
    position:absolute; left:0; right:0; bottom:96px;
    text-align:center;
    font-family:'Orbitron',sans-serif;
    font-weight:900; font-size:17px; letter-spacing:0.42em; text-indent:0.42em;
    color:#fff; text-shadow:0 0 12px rgba(255,255,255,0.25);
  }
  .wp-a .a-tag .r{ color:var(--green); text-shadow:0 0 12px rgba(166,255,0,0.85); }

  /* ================= WALLPAPER B : TYPOGRAPHIC SLOGAN ================= */
  .wp-b{
    background:
      linear-gradient(155deg, #14140f 0%, #0c0c0a 40%, #060606 100%);
  }
  /* big offset speed-slashes inside */
  .wp-b .b-slash{
    position:absolute; inset:-10%;
    background-image:repeating-linear-gradient(-30deg,
      transparent 0px, transparent 30px,
      rgba(166,255,0,0.06) 30px, rgba(166,255,0,0.06) 33px,
      transparent 33px, transparent 70px);
    -webkit-mask-image:linear-gradient(110deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
            mask-image:linear-gradient(110deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
    mix-blend-mode:screen;
  }
  .wp-b .b-type{
    position:absolute; left:34px; right:34px; top:50%;
    transform:translateY(-50%);
  }
  .wp-b .b-line{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:54px;
    line-height:0.98;
    letter-spacing:-0.01em;
    color:#fff;
    text-transform:uppercase;
    text-shadow:0 0 16px rgba(255,255,255,0.14);
  }
  .wp-b .b-line.green{
    color:var(--green);
    text-shadow:0 0 10px rgba(166,255,0,0.7), 0 0 30px rgba(166,255,0,0.45);
  }
  .wp-b .b-line.muted{ color:#3a3a3a; text-shadow:none; }
  .wp-b .b-rule{
    width:64px; height:5px; margin:22px 0;
    background:var(--green);
    box-shadow:0 0 14px rgba(166,255,0,0.8);
  }
  .wp-b .b-foot{
    position:absolute; left:34px; right:34px; bottom:90px;
    font-family:'Exo 2',sans-serif;
    font-weight:700; font-size:12px;
    letter-spacing:0.30em; text-indent:0.30em;
    color:var(--grey);
  }
  .wp-b .b-foot b{ color:#fff; }

  /* ================= WALLPAPER C : EMBLEM + DOTGRID ================= */
  .wp-c{
    background:radial-gradient(110% 80% at 50% 42%, #14140f 0%, #0a0a08 44%, #050505 80%);
  }
  .wp-c .c-grid{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(166,255,0,0.16) 1.4px, transparent 1.5px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(100% 80% at 50% 42%, #000 0%, rgba(0,0,0,0.4) 48%, transparent 82%);
            mask-image:radial-gradient(100% 80% at 50% 42%, #000 0%, rgba(0,0,0,0.4) 48%, transparent 82%);
    mix-blend-mode:screen;
  }
  .wp-c .c-ring{
    position:absolute; left:50%; top:42%;
    width:300px; height:300px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(166,255,0,0.20);
    border-radius:50%;
  }
  .wp-c .c-ring.r2{ width:230px; height:230px; border-color:rgba(166,255,0,0.30); }
  .wp-c .c-glow{
    position:absolute; left:50%; top:42%;
    width:260px; height:260px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(166,255,0,0.30) 0%, rgba(166,255,0,0) 62%);
    mix-blend-mode:screen; filter:blur(8px);
  }
  .wp-c .c-emblem{
    position:absolute; left:50%; top:42%;
    width:182px; height:182px;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 18px rgba(166,255,0,0.55)) drop-shadow(0 0 40px rgba(166,255,0,0.3));
  }
  .wp-c .c-emblem img{ width:100%; height:100%; display:block; }
  .wp-c .c-label{
    position:absolute; left:0; right:0; bottom:128px;
    text-align:center;
  }
  .wp-c .c-label .l1{
    font-family:'Exo 2',sans-serif;
    font-weight:800; font-size:13px;
    letter-spacing:0.46em; text-indent:0.46em;
    color:var(--grey);
    margin-bottom:12px;
  }
  .wp-c .c-label .l2{
    font-family:'Orbitron',sans-serif;
    font-weight:900; font-size:24px;
    letter-spacing:0.34em; text-indent:0.34em;
    color:#fff;
  }
  .wp-c .c-label .l2 .r{ color:var(--green); text-shadow:0 0 12px rgba(166,255,0,0.85); }

  /* ================= PHONE PLACEMENT (3D angles) ================= */
  .phone.left{
    left:-18px; top:120px;
    transform:rotateY(22deg) rotateZ(-5deg) translateZ(-70px) scale(0.92);
    z-index:4;
    filter:brightness(0.88);
  }
  .phone.center{
    left:50%; top:40px;
    margin-left:-180px;
    transform:rotateY(0deg) translateZ(40px) scale(1.05);
    z-index:6;
  }
  .phone.right{
    right:-18px; top:132px;
    transform:rotateY(-22deg) rotateZ(5deg) translateZ(-70px) scale(0.92);
    z-index:4;
    filter:brightness(0.88);
  }

  /* ---- floor reflections under each phone ---- */
  .reflect{
    position:absolute;
    z-index:3;
    pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 0%, rgba(0,0,0,0.5) 14%, transparent 42%);
            mask-image:linear-gradient(#000 0%, rgba(0,0,0,0.5) 14%, transparent 42%);
    opacity:0.30;
    filter:blur(1.5px);
  }

  /* glowing pool beneath the cluster */
  .pool{
    position:absolute;
    left:50%; bottom:96px;
    width:1020px; height:240px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side,
      rgba(180,255,90,0.42) 0%,
      rgba(166,255,0,0.30) 26%,
      rgba(166,255,0,0.12) 54%,
      rgba(166,255,0,0) 82%);
    filter:blur(26px);
    mix-blend-mode:screen;
    z-index:2;
    pointer-events:none;
  }
  .pool-hot{
    position:absolute;
    left:50%; bottom:150px;
    width:360px; height:64px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,255,255,0.7) 0%, rgba(200,255,120,0.35) 42%, rgba(166,255,0,0) 78%);
    filter:blur(12px);
    mix-blend-mode:screen;
    z-index:2;
    pointer-events:none;
  }

  /* ---- perspective floor grid ---- */
  .floor-grid{
    position:absolute;
    left:50%; bottom:0;
    width:2400px; height:360px;
    transform:translateX(-50%) perspective(560px) rotateX(76deg);
    transform-origin:bottom center;
    background-image:
      linear-gradient(rgba(166,255,0,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(166,255,0,0.10) 1px, transparent 1px);
    background-size:80px 80px;
    -webkit-mask-image:radial-gradient(70% 130% at 50% 100%, #000 0%, rgba(0,0,0,.5) 44%, transparent 76%);
            mask-image:radial-gradient(70% 130% at 50% 100%, #000 0%, rgba(0,0,0,.5) 44%, transparent 76%);
    mix-blend-mode:screen;
    z-index:1;
    pointer-events:none;
  }

  /* ================= STAGE CHROME / TYPE ================= */
  .head-mark{
    position:absolute;
    left:64px; top:54px;
    z-index:12;
    display:inline-flex; align-items:center; gap:14px;
  }
  .head-mark .hbolt{
    width:18px; height:29px;
    background:var(--green);
    -webkit-mask:url('../brand-assets/bolt.svg') center/contain no-repeat;
            mask:url('../brand-assets/bolt.svg') center/contain no-repeat;
    filter:drop-shadow(0 0 7px rgba(166,255,0,0.9));
  }
  .head-mark .htext{
    font-family:'Orbitron',sans-serif;
    font-weight:900; font-size:24px;
    letter-spacing:0.40em; text-indent:0.40em;
    color:#fff; text-shadow:0 0 10px rgba(255,255,255,0.22);
  }
  .head-mark .htext .r{ color:var(--green); text-shadow:0 0 12px rgba(166,255,0,0.8); }

  .head-kicker{
    position:absolute;
    right:64px; top:60px;
    z-index:12;
    font-family:'Exo 2',sans-serif;
    font-weight:700; font-size:13px;
    letter-spacing:0.34em; text-indent:0.34em;
    color:var(--grey);
    text-align:right;
  }
  .head-kicker b{ color:#fff; }

  .footline{
    position:absolute;
    left:50%; bottom:42px;
    transform:translateX(-50%);
    z-index:12;
    font-family:'Exo 2',sans-serif;
    font-weight:800; font-size:18px;
    letter-spacing:0.28em; text-indent:0.28em;
    color:var(--grey);
    display:inline-flex; align-items:center; gap:18px;
    white-space:nowrap;
  }
  .footline b{ color:#fff; }
  .footline .dot{ width:6px; height:6px; background:var(--green); box-shadow:0 0 8px rgba(166,255,0,0.9); }

  .partners{
    position:absolute;
    right:64px; bottom:46px;
    z-index:12;
    font-family:'Exo 2',sans-serif;
    font-weight:600; font-size:11px;
    letter-spacing:0.30em; text-indent:0.30em;
    color:#5a5a5a;
  }
  .partners b{ color:var(--grey); font-weight:700; }

  /* corner ticks (square UI chrome) */
  .tick{ position:absolute; z-index:12; width:38px; height:38px; pointer-events:none; }
  .tick::before,.tick::after{ content:""; position:absolute; background:rgba(166,255,0,0.5); box-shadow:0 0 8px rgba(166,255,0,0.5); }
  .tick::before{ width:38px; height:2px; }
  .tick::after{ width:2px; height:38px; }
  .tick.tl{ left:40px; top:40px; }
  .tick.tr{ right:40px; top:40px; }
  .tick.tr::before{ right:0; } .tick.tr::after{ right:0; }
  .tick.bl{ left:40px; bottom:40px; }
  .tick.bl::before{ bottom:0; } .tick.bl::after{ bottom:0; }
  .tick.br{ right:40px; bottom:40px; }
  .tick.br::before{ right:0; bottom:0; } .tick.br::after{ right:0; bottom:0; }

  /* ================= OVERLAYS ================= */
  .vignette{
    position:absolute; inset:0;
    z-index:18;
    pointer-events:none;
    background:radial-gradient(120% 100% at 50% 44%, transparent 50%, rgba(0,0,0,0.5) 84%, rgba(0,0,0,0.82) 100%);
  }
  .grain{
    position:absolute; inset:0;
    z-index:20;
    pointer-events:none;
    opacity:0.07;
    mix-blend-mode:overlay;
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- background light / texture -->
    <div class="spotlight"></div>
    <div class="ambient"></div>
    <div class="ambient-2"></div>
    <div class="slashes"></div>
    <div class="dotgrid"></div>

    <!-- floor light -->
    <div class="floor-grid"></div>
    <div class="pool"></div>
    <div class="pool-hot"></div>

    <!-- ===== floor reflections (mirrored phone screens) ===== -->
    <div class="reflect" style="left:-18px; top:878px; width:360px; height:760px; transform:rotateY(22deg) rotateZ(-5deg) scale(0.92) scaleY(-1);">
      <div style="width:360px;height:760px;border-radius:54px;background:radial-gradient(120% 90% at 50% 52%, #121b00, #0a0d02 40%, #050505 78%);box-shadow:0 0 60px rgba(166,255,0,0.25) inset;"></div>
    </div>
    <div class="reflect" style="left:50%; margin-left:-180px; top:810px; width:360px; height:760px; transform:scale(1.04) scaleY(-1); z-index:3;">
      <div style="width:360px;height:760px;border-radius:54px;background:linear-gradient(155deg,#14140f,#0c0c0a 42%,#060606);box-shadow:0 0 60px rgba(166,255,0,0.2) inset;"></div>
    </div>
    <div class="reflect" style="right:-18px; top:888px; width:360px; height:760px; transform:rotateY(-22deg) rotateZ(5deg) scale(0.92) scaleY(-1);">
      <div style="width:360px;height:760px;border-radius:54px;background:radial-gradient(110% 80% at 50% 42%, #14140f, #0a0a08 46%, #050505 82%);box-shadow:0 0 60px rgba(166,255,0,0.22) inset;"></div>
    </div>

    <!-- ================= PHONES ================= -->
    <div class="phones">

      <!-- ---------- LEFT : GIANT BOLT ---------- -->
      <div class="phone left">
        <span class="btn-vol"></span><span class="btn-pwr"></span>
        <div class="screen">
          <div class="wp wp-a">
            <div class="a-glow"></div>
            <div class="a-bolt"><img src="../brand-assets/bolt.svg" alt="SHFT bolt"></div>
            <div class="a-sheen"></div>
            <div class="a-tag">SHFT <span class="r">ROBOTICS</span></div>
          </div>
          <div class="notch"></div>
          <div class="status">
            <span>9:41</span>
            <span class="sig">
              <span class="bars"><i></i><i></i><i></i><i></i></span>
              <span class="batt"><i></i></span>
            </span>
          </div>
          <div class="clock">
            <div class="day">SATURDAY, JUNE 6</div>
            <div class="time">9:41</div>
          </div>
          <div class="dock">
            <span class="key"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/><path d="M12 8v4l3 2"/></svg></span>
            <span class="key"><svg viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></svg></span>
          </div>
          <div class="swipe"></div>
          <div class="screen-glass"></div>
        </div>
      </div>

      <!-- ---------- CENTER : TYPOGRAPHIC SLOGAN ---------- -->
      <div class="phone center">
        <span class="btn-vol"></span><span class="btn-pwr"></span>
        <div class="screen">
          <div class="wp wp-b">
            <div class="b-slash"></div>
            <div class="b-type">
              <div class="b-line muted">WE DON'T</div>
              <div class="b-line">FOLLOW.</div>
              <div class="b-rule"></div>
              <div class="b-line">WE</div>
              <div class="b-line green">SHFT.</div>
            </div>
            <div class="b-foot"><b>INNOVATE.</b> BUILD. COMPETE.</div>
          </div>
          <div class="notch"></div>
          <div class="status">
            <span>9:41</span>
            <span class="sig">
              <span class="bars"><i></i><i></i><i></i><i></i></span>
              <span class="batt"><i></i></span>
            </span>
          </div>
          <div class="dock">
            <span class="key"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/><path d="M12 8v4l3 2"/></svg></span>
            <span class="key"><svg viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></svg></span>
          </div>
          <div class="swipe"></div>
          <div class="screen-glass"></div>
        </div>
      </div>

      <!-- ---------- RIGHT : EMBLEM + DOT GRID ---------- -->
      <div class="phone right">
        <span class="btn-vol"></span><span class="btn-pwr"></span>
        <div class="screen">
          <div class="wp wp-c">
            <div class="c-grid"></div>
            <div class="c-glow"></div>
            <div class="c-ring"></div>
            <div class="c-ring r2"></div>
            <div class="c-emblem"><img src="../brand-assets/icon-transparent.png" alt="SHFT emblem"></div>
            <div class="c-label">
              <div class="l1">EST. ONE SHIFT AT A TIME</div>
              <div class="l2">SHFT <span class="r">7558</span></div>
            </div>
          </div>
          <div class="notch"></div>
          <div class="status">
            <span>9:41</span>
            <span class="sig">
              <span class="bars"><i></i><i></i><i></i><i></i></span>
              <span class="batt"><i></i></span>
            </span>
          </div>
          <div class="dock">
            <span class="key"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8"/><path d="M12 8v4l3 2"/></svg></span>
            <span class="key"><svg viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></svg></span>
          </div>
          <div class="swipe"></div>
          <div class="screen-glass"></div>
        </div>
      </div>

    </div>

    <!-- ================= STAGE CHROME ================= -->
    <div class="head-mark">
      <span class="hbolt"></span>
      <span class="htext">SHFT <span class="r">ROBOTICS</span></span>
    </div>
    <div class="head-kicker">LOCK-SCREEN SET <br><b>03 WALLPAPERS</b></div>

    <div class="footline">
      <b>INNOVATE</b><span class="dot"></span><b>BUILD</b><span class="dot"></span><b>COMPETE</b>
    </div>
    <div class="partners">WITH <b>ALT-F4</b> &nbsp;/&nbsp; <b>WCP</b></div>

    <!-- corner chrome -->
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>

    <!-- overlays -->
    <div class="vignette"></div>
    <svg class="grain" width="100%" height="100%">
      <filter id="grainf">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainf)"/>
    </svg>

  </div>
</body>
</html>
