<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHFT Post Template (1080x1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
    SHFT POST TEMPLATE  ·  1080 x 1080  (1:1)
    --------------------------------------------------------------
    HOW TO USE
    1. Open this file in Chrome.
    2. Edit the three swappable lines below in the HTML:
         - .headline   (Orbitron, big)
         - .subline    (the supporting line)
         - .cta        (the square button text)
    3. Screenshot the .frame at full size and crop to the frame edges.
       A 1080x1080 emulation gives a clean grab.
    --------------------------------------------------------------
    REAL BRAND: white canvas, sharp square edges, type first, lime is rare.
    No em dashes anywhere in copy.
  */
  :root {
    --bg:#FFFFFF; --surface:#F8F8F8; --ink:#1A1A1A; --border:#E5E5E5;
    --secondary:#555555; --muted:#737373;
    --lime:#A6FF00; --lime-hover:#8FE000; --lime-text:#1A1A1A; --lime-dim:#5A8C00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #F8F8F8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Raleway', sans-serif;
  }

  /* The capture frame. Screenshot exactly this. White canvas. */
  .frame {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #FFFFFF;
    overflow: hidden;
    color: var(--ink);
    display: flex;
  }

  .inner {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 88px 92px 80px;
  }

  /* Top row: section label + handle */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .label .rule {
    display: inline-block;
    width: 40px; height: 3px;
    background: var(--lime);
  }
  .label .txt {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .handle {
    font-family: 'Exo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  /* Headline block, centered vertically */
  .main {
    margin-top: auto;
    margin-bottom: auto;
  }
  /* Short lime rule above the headline */
  .accent-rule {
    width: 96px; height: 6px;
    background: var(--lime);
    margin-bottom: 40px;
  }
  .headline {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 104px;
    line-height: 0.96;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }
  /* Emphasis on white = ink word with a lime underline rule, not lime text */
  .headline .hl {
    color: var(--ink);
    box-shadow: inset 0 -0.12em 0 var(--lime);
  }
  .subline {
    margin-top: 36px;
    font-family: 'Raleway', sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.35;
    color: var(--secondary);
    max-width: 720px;
  }

  /* Bottom row: CTA + wordmark */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  /* Square lime CTA chip, ink text */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--lime);
    color: var(--lime-text);
    font-family: 'Exo 2', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 22px 44px;
    border: 0;
    border-radius: 0;
  }
  .cta .arrow { font-weight: 800; }
  .wordmark {
    height: 60px;
    width: auto;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="inner">

      <!-- TOP ROW: section label + handle -->
      <div class="top">
        <div class="label">
          <span class="rule"></span>
          <!-- SECTION LABEL (swap freely) -->
          <span class="txt">01 / New Ontario FRC Team</span>
        </div>
        <div class="handle">@shftrobotics</div>
      </div>

      <!-- HEADLINE (swap me). Wrap key words in <span class="hl"> for a lime underline. -->
      <div class="main">
        <span class="accent-rule"></span>
        <h1 class="headline">Shift the<br /><span class="hl">standard.</span></h1>

        <!-- SUBLINE (swap me) -->
        <p class="subline">Built to compete from day one. No experience needed.</p>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <!-- CTA (swap me) -->
        <div class="cta">Join SHFT <span class="arrow">&rarr;</span></div>
        <img class="wordmark" src="../../website/public/images/logo/wordmark-dark.png" alt="SHFT" />
      </div>

    </div>
  </div>
</body>
</html>
