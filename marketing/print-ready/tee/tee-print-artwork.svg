<?xml version="1.0" encoding="UTF-8"?>
<!--
  SHFT ROBOTICS - T-SHIRT MASTER PRINT ARTWORK SHEET
  Scale: 1 user unit = 1 mm (1:1). Output film / screens at 100%.
  Garment: black tee (Bella+Canvas 3001 / Gildan 64000).
  Colors: 2 max - White #FFFFFF + Lime spot #A6FF00 (match PMS 802 C or 809 C / neon ink).
  Real vector art is referenced unmodified from ../../brand-assets/ - do not redraw or rasterize.
  Placement 1 (full front): wordmark.svg, 260 mm wide, centered, top 75 mm below collar seam.
  Placement 2 (left chest): bolt.svg, 90 mm tall, 70 mm right of center, 70 mm below shoulder seam.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="420mm" height="297mm" viewBox="0 0 420 297">

  <style>
    .ink    { fill:#1A1A1A; }
    .reg    { stroke:#1A1A1A; stroke-width:0.25; fill:none; }
    .regln  { stroke:#1A1A1A; stroke-width:0.2; fill:none; stroke-dasharray:2 1.4; }
    .dimln  { stroke:#1A1A1A; stroke-width:0.25; fill:none; }
    .h1     { font-family:'Exo 2','Helvetica Neue',Arial,sans-serif; font-weight:700; fill:#1A1A1A; }
    .h2     { font-family:'Exo 2','Helvetica Neue',Arial,sans-serif; font-weight:600; fill:#5b6066; }
    .lbl    { font-family:'Raleway','Helvetica Neue',Arial,sans-serif; font-weight:600; fill:#1A1A1A; }
    .meta   { font-family:'Raleway','Helvetica Neue',Arial,sans-serif; font-weight:400; fill:#5b6066; }
    .spot   { font-family:'Raleway','Helvetica Neue',Arial,sans-serif; font-weight:600; fill:#b0640a; }
  </style>

  <!-- sheet border -->
  <rect x="6" y="6" width="408" height="285" fill="#ffffff" stroke="#D4D4D4" stroke-width="0.4"/>

  <!-- ============ HEADER ============ -->
  <text x="16" y="22" class="h1" font-size="9" letter-spacing="0.4">SHFT ROBOTICS</text>
  <text x="16" y="29" class="h2" font-size="3.6" letter-spacing="0.8">TEE MASTER PRINT ARTWORK  /  1:1 mm  /  SCREEN PRINT  /  2 COLORS</text>
  <line x1="16" y1="33" x2="404" y2="33" class="dimln"/>

  <!-- ============ PLACEMENT 1 : FULL FRONT ============ -->
  <!-- print box: 260 wide; wordmark aspect 1.7726 -> height 146.68 -->
  <!-- positioned upper-left quadrant -->
  <g transform="translate(40,70)">
    <text x="0" y="-12" class="h1" font-size="5" letter-spacing="0.3">1  FULL FRONT</text>
    <text x="0" y="-6" class="meta" font-size="3.2">wordmark.svg  -  260 mm wide  -  centered, top 75 mm below collar seam</text>

    <!-- garment field: shows white + lime art as it appears on the black tee -->
    <rect x="0" y="0" width="260" height="146.68" fill="#1A1A1A"/>
    <!-- print-area box -->
    <rect x="0" y="0" width="260" height="146.68" class="regln"/>

    <!-- the real vector, embedded unmodified, scaled to 260 wide -->
    <image x="0" y="0" width="260" height="146.68" xlink:href="../../brand-assets/wordmark.svg"
           preserveAspectRatio="xMidYMid meet"/>

    <!-- center registration crosshair (above the field, then light marks on the field) -->
    <line x1="130" y1="-3" x2="130" y2="0" class="reg"/>
    <line x1="127" y1="73.34" x2="133" y2="73.34" stroke="#A3A3A3" stroke-width="0.25"/>
    <line x1="130" y1="70.34" x2="130" y2="76.34" stroke="#A3A3A3" stroke-width="0.25"/>

    <!-- width dimension -->
    <line x1="0" y1="156" x2="260" y2="156" class="dimln"/>
    <line x1="0" y1="153" x2="0" y2="159" class="dimln"/>
    <line x1="260" y1="153" x2="260" y2="159" class="dimln"/>
    <rect x="112" y="158" width="36" height="7" fill="#ffffff"/>
    <text x="130" y="163" class="lbl" font-size="3.8" text-anchor="middle">260 mm</text>
  </g>

  <!-- ============ PLACEMENT 2 : LEFT CHEST ============ -->
  <!-- bolt 90 tall; aspect w/h 0.6309 -> width 56.78 -->
  <g transform="translate(330,80)">
    <text x="-18" y="-22" class="h1" font-size="5" letter-spacing="0.3">2  LEFT CHEST</text>
    <text x="-18" y="-16" class="meta" font-size="3.2">bolt.svg  -  90 mm tall</text>
    <text x="-18" y="-11.5" class="meta" font-size="3.2">70 mm right of center, 70 mm below shoulder seam</text>

    <!-- garment field -->
    <rect x="0" y="0" width="56.78" height="90" fill="#1A1A1A"/>
    <!-- print-area box -->
    <rect x="0" y="0" width="56.78" height="90" class="regln"/>

    <!-- real vector embedded unmodified -->
    <image x="0" y="0" width="56.78" height="90" xlink:href="../../brand-assets/bolt.svg"
           preserveAspectRatio="xMidYMid meet"/>

    <!-- height dimension -->
    <line x1="64" y1="0" x2="64" y2="90" class="dimln"/>
    <line x1="61" y1="0" x2="67" y2="0" class="dimln"/>
    <line x1="61" y1="90" x2="67" y2="90" class="dimln"/>
    <rect x="66" y="41" width="22" height="7" fill="#ffffff"/>
    <text x="69" y="46" class="lbl" font-size="3.8">90 mm</text>

    <!-- alt note -->
    <text x="-18" y="110" class="meta" font-size="3">Alt left-chest mark: shft.svg (compact, 90 mm wide).</text>
  </g>

  <!-- ============ COLOR / SPOT CALLOUT ============ -->
  <g transform="translate(40,240)">
    <text x="0" y="0" class="h1" font-size="4.4" letter-spacing="0.3">COLORS  -  2 MAX</text>

    <rect x="0" y="5" width="8" height="8" fill="#A6FF00" stroke="#D4D4D4" stroke-width="0.3"/>
    <text x="11" y="11" class="lbl" font-size="3.6">Lime  #A6FF00  -  SPOT</text>

    <rect x="78" y="5" width="8" height="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="0.3"/>
    <text x="89" y="11" class="lbl" font-size="3.6">White  #FFFFFF</text>

    <rect x="150" y="5" width="8" height="8" fill="#1A1A1A" stroke="#D4D4D4" stroke-width="0.3"/>
    <text x="161" y="11" class="lbl" font-size="3.6">Ink  #1A1A1A  (garment)</text>

    <text x="0" y="23" class="spot" font-size="3.4">Lime must print as a spot color. Match to PMS 802 C or 809 C, or a neon ink.</text>
    <text x="0" y="28" class="spot" font-size="3.4">Plain CMYK prints flat olive. Confirm a physical swatch before the run.</text>
  </g>

  <!-- footer -->
  <line x1="16" y1="276" x2="404" y2="276" class="dimln"/>
  <text x="16" y="283" class="meta" font-size="3">Vector art referenced unmodified from /marketing/brand-assets/. Output at 100%.  shftrobotics.com  /  @shftrobotics</text>
</svg>
