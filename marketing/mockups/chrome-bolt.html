<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHFT ROBOTICS / Chrome Bolt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Exo+2:wght@600;700;800&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0A0A0A;
    --bg1:#1A1A1A;
    --green:#A6FF00;
    --green-soft:rgba(166,255,0,.55);
    --white:#FFFFFF;
    --grey:#A3A3A3;
    /* inline bolt mask (same path as ../brand-assets/bolt.svg, with explicit width/height so it sizes as a CSS mask) */
    --bolt:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22488.92%22%20height%3D%22826.00%22%20viewBox%3D%22938.86%20126.55%20488.92%20826.00%22%3E%3Cpath%20d%3D%22M1045.92%2C580.82L1134.07%2C581.32L938.86%2C952.55L1320.72%2C498.28L1232.57%2C497.77L1427.78%2C126.55Z%22%20fill%3D%22%23000%22%2F%3E%3C%2Fsvg%3E");
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#040404; }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Raleway',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ===================== STAGE ===================== */
  .stage{
    position:relative;
    width:1600px;
    height:1600px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 30%, #161616 0%, #0c0c0c 45%, #060606 72%, #020202 100%);
    isolation:isolate;
  }

  /* ----- ambient vignette + floor split ----- */
  .vignette{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(80% 60% at 50% 38%, rgba(166,255,0,.10), transparent 60%),
      radial-gradient(140% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%);
  }

  /* ----- faint dot grid ----- */
  .dotgrid{
    position:absolute; inset:-40px; z-index:1; pointer-events:none;
    background-image:radial-gradient(rgba(166,255,0,.10) 1.4px, transparent 1.6px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(60% 55% at 50% 42%, #000 0%, transparent 78%);
            mask-image:radial-gradient(60% 55% at 50% 42%, #000 0%, transparent 78%);
    opacity:.55;
  }

  /* ----- diagonal speed slashes ----- */
  .slashes{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background-image:repeating-linear-gradient(
      -34deg,
      rgba(166,255,0,.06) 0px,
      rgba(166,255,0,.06) 2px,
      transparent 2px,
      transparent 64px);
    -webkit-mask-image:linear-gradient(115deg, #000 0%, transparent 42%, transparent 60%, #000 100%);
            mask-image:linear-gradient(115deg, #000 0%, transparent 42%, transparent 60%, #000 100%);
    opacity:.5;
    mix-blend-mode:screen;
  }

  /* ----- the glowing floor band ----- */
  .floor{
    position:absolute; left:0; right:0; bottom:0; height:560px; z-index:1;
    background:
      linear-gradient(180deg, transparent 0%, rgba(166,255,0,.05) 30%, rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
  }
  /* perspective floor lines */
  .floorlines{
    position:absolute; left:50%; bottom:0; width:2600px; height:520px; z-index:1;
    transform:translateX(-50%) perspective(620px) rotateX(72deg);
    transform-origin:bottom center;
    background-image:
      linear-gradient(90deg, rgba(166,255,0,.16) 1px, transparent 1px),
      linear-gradient(0deg, rgba(166,255,0,.12) 1px, transparent 1px);
    background-size:120px 120px;
    -webkit-mask-image:radial-gradient(60% 100% at 50% 100%, #000 0%, transparent 80%);
            mask-image:radial-gradient(60% 100% at 50% 100%, #000 0%, transparent 80%);
    opacity:.7;
  }

  /* ----- glowing contact pool under the bolt ----- */
  .pool{
    position:absolute; left:50%; bottom:268px; z-index:3;
    width:760px; height:200px;
    transform:translateX(-50%);
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(166,255,0,.92) 0%,
      rgba(166,255,0,.42) 26%,
      rgba(166,255,0,.12) 52%,
      transparent 74%);
    filter:blur(14px);
    mix-blend-mode:screen;
  }
  .pool.core{
    width:360px; height:74px; bottom:332px;
    background:radial-gradient(50% 50% at 50% 50%, #ffffff 0%, #e7ffc4 24%, rgba(166,255,0,.6) 55%, transparent 80%);
    filter:blur(6px);
  }

  /* ===================== BOLT STACK ===================== */
  .boltwrap{
    position:absolute; left:50%; top:50%; z-index:5;
    transform:translate(-50%, -54%) perspective(1400px) rotateX(9deg) rotateY(-7deg) rotateZ(-2deg);
    transform-style:preserve-3d;
  }
  .boltstage{ position:relative; width:560px; height:888px; }

  /* every bolt layer shares this */
  .boltstage .layer{
    position:absolute; inset:0;
    width:100%; height:100%;
    background:#A6FF00;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
  }

  /* EXTRUSION: many stacked dark-green layers pushed down/right = thickness */
  .extrude .layer{
    background:#3f6b00;
  }
  .extrude .layer:nth-child(1){ transform:translate(13px,18px); background:#1c3000; }
  .extrude .layer:nth-child(2){ transform:translate(12px,16px); background:#234000; }
  .extrude .layer:nth-child(3){ transform:translate(10px,14px); background:#2c5200; }
  .extrude .layer:nth-child(4){ transform:translate(8px,12px);  background:#356100; }
  .extrude .layer:nth-child(5){ transform:translate(6px,9px);   background:#3f7400; }
  .extrude .layer:nth-child(6){ transform:translate(4px,6px);   background:#4e8c00; }
  .extrude .layer:nth-child(7){ transform:translate(2px,3px);   background:#5fa600; }

  /* bloom halos behind the face (big soft glows) */
  .bloom{
    position:absolute; inset:0;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    background:#A6FF00;
  }
  .bloom.b1{ filter:blur(52px); opacity:.7;  transform:scale(1.05); mix-blend-mode:screen; }
  .bloom.b2{ filter:blur(22px); opacity:.9;  mix-blend-mode:screen; }
  .bloom.b3{ filter:blur(6px);  opacity:1;   mix-blend-mode:screen; }

  /* THE FACE: bright green with a vertical sheen + inner highlight */
  .face{
    background:
      linear-gradient(118deg,
        #cdff5e 0%,
        #A6FF00 28%,
        #8fe000 52%,
        #b6ff3a 70%,
        #A6FF00 100%);
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    position:absolute; inset:0;
    filter:drop-shadow(0 0 16px rgba(166,255,0,.9));
  }
  /* moving foil/holo band across the face */
  .holo{
    position:absolute; inset:0;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    background:conic-gradient(from 210deg at 50% 40%,
      rgba(255,255,255,.0) 0deg,
      rgba(255,255,255,.55) 40deg,
      rgba(255,255,255,0) 90deg,
      rgba(166,255,0,.0) 200deg,
      rgba(255,255,255,.35) 300deg,
      rgba(255,255,255,0) 360deg);
    mix-blend-mode:overlay;
    opacity:.8;
  }
  /* bright white core streak down the spine */
  .core{
    position:absolute; inset:0;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    background:linear-gradient(122deg, transparent 38%, rgba(255,255,255,.95) 49%, rgba(255,255,255,.0) 60%);
    mix-blend-mode:screen;
    filter:blur(1px);
  }
  /* crisp top-edge rim light */
  .rim{
    position:absolute; inset:0;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 12%);
    mix-blend-mode:screen;
    opacity:.85;
  }
  /* hot specular hit near the top fold for chrome-neon punch */
  .glint{
    position:absolute; inset:0;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    background:radial-gradient(26% 16% at 62% 24%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%);
    mix-blend-mode:screen;
  }

  /* ===================== ELECTRIC ARCS ===================== */
  .arcs{
    position:absolute; left:50%; top:50%; z-index:6;
    width:1000px; height:1100px;
    transform:translate(-50%,-54%);
    pointer-events:none;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 6px rgba(166,255,0,.9));
  }
  .arcs path, .arcs polyline{
    fill:none; stroke:#d6ff7a; stroke-width:2.2;
    stroke-linejoin:round; stroke-linecap:round;
    opacity:.85;
  }
  .arcs .hot{ stroke:#ffffff; stroke-width:1.2; opacity:.95; }
  .spark{ fill:#eaffc0; stroke:none; filter:drop-shadow(0 0 5px #A6FF00); }

  /* ===================== FLOOR REFLECTION ===================== */
  .reflection{
    position:absolute; left:50%; top:50%; z-index:4;
    width:560px; height:888px;
    transform:translate(-50%,-54%) perspective(1400px) rotateX(9deg) rotateY(-7deg) rotateZ(-2deg) scaleY(-1);
    transform-origin:center bottom;
    margin-top:1130px;
    opacity:.32;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 46%);
            mask-image:linear-gradient(180deg, rgba(0,0,0,.9) 0%, transparent 46%);
    filter:blur(3px);
  }
  .reflection .rface{
    position:absolute; inset:0;
    background:#A6FF00;
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
  }

  /* ===================== TYPE ===================== */
  .topmark{
    position:absolute; top:96px; left:50%; transform:translateX(-50%);
    z-index:8; text-align:center;
  }
  .topmark .kick{
    font-family:'Exo 2',sans-serif; font-weight:700;
    font-size:18px; letter-spacing:.62em; text-transform:uppercase;
    color:var(--grey); padding-left:.62em;
  }
  .topmark .kick b{ color:var(--green); }

  .base{
    position:absolute; left:0; right:0; bottom:120px; z-index:8;
    text-align:center;
  }
  .wordmark{
    height:62px; width:auto; display:inline-block;
    filter:drop-shadow(0 0 16px rgba(166,255,0,.35));
    margin-bottom:30px;
  }
  .tagline{
    display:flex; align-items:center; justify-content:center; gap:26px;
    font-family:'Orbitron',sans-serif; font-weight:900;
    text-transform:uppercase;
  }
  .tagline span{
    font-size:34px; letter-spacing:.10em; color:var(--white);
    text-shadow:
      0 0 1px rgba(255,255,255,.6),
      0 0 18px rgba(255,255,255,.18);
  }
  .tagline em{
    font-style:normal; color:var(--green);
    display:inline-block; width:7px; height:7px;
    background:var(--green); transform:rotate(45deg);
    box-shadow:0 0 14px var(--green), 0 0 30px rgba(166,255,0,.6);
  }
  .slogan{
    margin-top:24px;
    font-family:'Exo 2',sans-serif; font-weight:700;
    font-size:15px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--grey); padding-left:.42em;
  }
  .slogan b{ color:var(--green); }

  /* partners chip, tiny, lower corner */
  .partners{
    position:absolute; bottom:54px; right:64px; z-index:8;
    display:flex; align-items:center; gap:14px;
    font-family:'Exo 2',sans-serif; font-weight:600;
    font-size:12px; letter-spacing:.28em; text-transform:uppercase;
    color:#6f6f6f;
  }
  .partners .lbl{ color:#555; letter-spacing:.34em; }
  .partners .p{
    color:#bdbdbd; border:1px solid rgba(166,255,0,.22);
    padding:5px 11px; background:rgba(166,255,0,.04);
  }
  .team{
    position:absolute; bottom:56px; left:64px; z-index:8;
    display:flex; align-items:center; gap:12px;
  }
  .team .teambolt{
    display:inline-block; width:24px; height:38px;
    background:var(--white);
    -webkit-mask:var(--bolt) center / contain no-repeat;
            mask:var(--bolt) center / contain no-repeat;
    filter:drop-shadow(0 0 8px rgba(166,255,0,.5));
  }
  .team .id{
    font-family:'Orbitron',sans-serif; font-weight:800;
    font-size:15px; letter-spacing:.18em; color:#cfcfcf;
  }
  .team .id b{ color:var(--green); }

  /* corner ticks for poster framing */
  .tick{ position:absolute; z-index:8; width:30px; height:30px; }
  .tick::before,.tick::after{ content:""; position:absolute; background:rgba(166,255,0,.5); }
  .tick::before{ width:30px; height:2px; }
  .tick::after{ width:2px; height:30px; }
  .tick.tl{ top:48px; left:48px; }
  .tick.tr{ top:48px; right:48px; }
  .tick.tr::before{ right:0; } .tick.tr::after{ right:0; }
  .tick.bl{ bottom:48px; left:48px; } .tick.bl::before{ bottom:0; } .tick.bl::after{ bottom:0; }
  .tick.br{ bottom:48px; right:48px; }
  .tick.br::before{ right:0; bottom:0; } .tick.br::after{ right:0; bottom:0; }

  /* ----- grain overlay ----- */
  .grain{
    position:absolute; inset:0; z-index:9; pointer-events:none;
    opacity:.05; mix-blend-mode:overlay;
  }
</style>
</head>
<body>
  <div class="stage">

    <!-- background texture stack -->
    <div class="dotgrid"></div>
    <div class="slashes"></div>
    <div class="floor"></div>
    <div class="floorlines"></div>

    <!-- top kicker -->
    <div class="topmark">
      <div class="kick">WE DON'T FOLLOW <b>/</b> WE SHFT</div>
    </div>

    <!-- glowing contact pools -->
    <div class="pool"></div>
    <div class="pool core"></div>

    <!-- floor reflection of the bolt -->
    <div class="reflection">
      <div class="rface"></div>
    </div>

    <!-- the hero bolt -->
    <div class="boltwrap">
      <div class="boltstage">
        <!-- extruded thickness -->
        <div class="extrude">
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
        </div>
        <!-- neon bloom behind the face -->
        <div class="bloom b1"></div>
        <div class="bloom b2"></div>
        <div class="bloom b3"></div>
        <!-- bright face + finishes -->
        <div class="face"></div>
        <div class="holo"></div>
        <div class="core"></div>
        <div class="rim"></div>
        <div class="glint"></div>
      </div>
    </div>

    <!-- electric arcs -->
    <svg class="arcs" viewBox="0 0 1000 1100" xmlns="http://www.w3.org/2000/svg">
      <polyline points="560,250 612,270 600,308 666,300 642,344"/>
      <polyline class="hot" points="560,250 612,270 600,308 666,300 642,344"/>
      <polyline points="420,520 360,540 388,576 320,592 352,628"/>
      <polyline class="hot" points="420,520 360,540 388,576 320,592 352,628"/>
      <polyline points="640,640 706,650 686,690 752,700 726,742"/>
      <polyline points="470,360 432,330 452,300 410,276"/>
      <polyline class="hot" points="470,360 432,330 452,300 410,276"/>
      <polyline points="540,820 590,842 572,878 626,892"/>
      <circle class="spark" cx="666" cy="300" r="4"/>
      <circle class="spark" cx="320" cy="592" r="3.5"/>
      <circle class="spark" cx="752" cy="700" r="3.5"/>
      <circle class="spark" cx="410" cy="276" r="3"/>
      <circle class="spark" cx="626" cy="892" r="3"/>
    </svg>

    <!-- base lockup -->
    <div class="base">
      <img class="wordmark" src="../brand-assets/wordmark-shft-robotics.png" alt="SHFT ROBOTICS">
      <div class="tagline">
        <span>INNOVATE</span><em></em>
        <span>BUILD</span><em></em>
        <span>COMPETE</span>
      </div>
      <div class="slogan">BUILDING THE FUTURE <b>/</b> ONE SHIFT AT A TIME</div>
    </div>

    <!-- team + partners -->
    <div class="team">
      <i class="teambolt" aria-hidden="true"></i>
      <div class="id">SHFT <b>7558</b></div>
    </div>
    <div class="partners">
      <span class="lbl">POWERED BY</span>
      <span class="p">ALT-F4</span>
      <span class="p">WCP</span>
    </div>

    <!-- frame ticks -->
    <div class="tick tl"></div>
    <div class="tick tr"></div>
    <div class="tick bl"></div>
    <div class="tick br"></div>

    <!-- lighting + vignette -->
    <div class="vignette"></div>

    <!-- film grain -->
    <svg class="grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grainf">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainf)"/>
    </svg>

  </div>
</body>
</html>
