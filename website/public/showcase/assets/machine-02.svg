<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <pattern id="d2" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" x="16" y="16" fill="#A6FF00" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#1A1A1A"/>
  <rect width="800" height="600" fill="url(#d2)"/>
  <!-- base -->
  <rect x="220" y="440" width="240" height="60" fill="none" stroke="#A6FF00" stroke-width="4"/>
  <!-- mast -->
  <line x1="300" y1="440" x2="300" y2="160" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
  <line x1="330" y1="440" x2="330" y2="200" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
  <!-- two-stage arm -->
  <line x1="300" y1="200" x2="520" y2="150" stroke="#A6FF00" stroke-width="7"/>
  <line x1="520" y1="150" x2="640" y2="240" stroke="#A6FF00" stroke-width="7"/>
  <g fill="#1A1A1A" stroke="#A6FF00" stroke-width="4">
    <circle cx="300" cy="200" r="16"/><circle cx="520" cy="150" r="16"/><circle cx="640" cy="240" r="12"/>
  </g>
  <!-- claw -->
  <polyline points="640,240 676,260 660,290" fill="none" stroke="#ffffff" stroke-width="4"/>
  <polyline points="640,240 622,286 652,300" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- motion arcs -->
  <path d="M 420 128 A 160 160 0 0 1 560 260" fill="none" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 8"/>
  <text x="240" y="545" fill="#737373" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">ARM 02 / TWO-STAGE LIFT</text>
</svg>
