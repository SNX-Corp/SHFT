<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SHFT Hallway Poster (Tabloid 11x17)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,900&family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  @page { size: 11in 17in; margin: 0; }

  :root{
    --bg:#0D0D0D;
    --lime:#A6FF00;
    --white:#FFFFFF;
    --gray:#9A9A9A;
    --line:#262626;
  }

  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body{ margin:0; padding:0; background:#3a3a3a; }

  .page{
    width:11in; height:17in;
    margin:0 auto;
    background:var(--bg);
    color:var(--white);
    font-family:'Raleway',sans-serif;
    position:relative; overflow:hidden;
    padding:0.9in 0.85in 0.7in;
    display:flex; flex-direction:column;
  }

  /* GIANT bolt, dominant graphic, bleeds off the right edge */
  .megabolt{
    position:absolute; right:-2.2in; top:3.6in;
    width:10in; opacity:0.92; transform:rotate(6deg);
    z-index:0; filter:drop-shadow(0 0 1.4in rgba(175,248,8,0.35));
  }
  /* a second ghost bolt, faint, top-left for depth */
  .ghostbolt{
    position:absolute; left:-2.6in; top:-1.4in;
    width:7in; opacity:0.05; transform:rotate(-14deg); z-index:0;
  }

  .layer{ position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ height:0.95in; width:auto; }
  .teamtag{
    font-family:'Exo 2',sans-serif; font-weight:800; font-size:15pt;
    letter-spacing:0.18em; color:var(--lime); text-transform:uppercase; text-align:right; line-height:1.3;
  }
  .teamtag small{ display:block; color:var(--gray); font-weight:700; font-size:10pt; letter-spacing:0.2em; }

  /* huge headline, the whole point */
  .headline{
    font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic;
    text-transform:uppercase; line-height:0.86; letter-spacing:-0.015em;
    font-size:118pt; margin:1.2in 0 0;
    max-width:8.2in;
  }
  .headline .lime{ color:var(--lime); }

  .kicker{
    font-family:'Exo 2',sans-serif; font-weight:800; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--white); font-size:28pt; line-height:1.1;
    margin-top:0.45in; max-width:7.5in;
  }
  .kicker .sub{ display:block; color:var(--gray); font-family:'Raleway',sans-serif; font-weight:700; font-size:19pt; letter-spacing:0; margin-top:0.18in; }

  /* bottom band: CTA + QR, anchored */
  .bottom{ margin-top:auto; display:flex; align-items:stretch; gap:0.4in; }
  .cta{
    flex:1; background:var(--lime); color:var(--bg); border-radius:14px;
    display:flex; flex-direction:column; justify-content:center; padding:0.4in 0.5in;
  }
  .cta .big{
    font-family:'Exo 2',sans-serif; font-weight:900; font-style:italic;
    text-transform:uppercase; font-size:60pt; line-height:0.9; letter-spacing:-0.01em;
  }
  .cta .small{ font-family:'Exo 2',sans-serif; font-weight:800; font-size:18pt; letter-spacing:0.04em; margin-top:0.12in; text-transform:uppercase; }

  .qr{
    flex:0 0 2.7in; width:2.7in; border:4px solid var(--lime); border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.2in;
  }
  .qr .qbox{
    width:1.9in; height:1.9in; border:3px dashed var(--gray); border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:var(--gray);
    font-weight:800; font-size:13pt; letter-spacing:0.1em; text-transform:uppercase; text-align:center; margin-bottom:0.16in;
  }
  .qr .url{ font-family:'Exo 2',sans-serif; font-weight:900; font-size:16pt; color:var(--white); letter-spacing:0.02em; }

  .footstrip{
    margin-top:0.4in; padding-top:0.22in; border-top:3px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    color:var(--gray); font-weight:700; font-size:13pt; letter-spacing:0.05em;
  }
  .footstrip .crest{ display:flex; align-items:center; gap:0.16in; color:var(--white); }
  .footstrip .crest svg{ width:0.5in; height:0.5in; color:var(--lime); }
  .footstrip .crest b{ font-family:'Exo 2',sans-serif; font-weight:800; letter-spacing:0.06em; }
  .footstrip .handle{ color:var(--lime); font-family:'Exo 2',sans-serif; font-weight:900; font-size:15pt; letter-spacing:0.04em; }
</style>
</head>
